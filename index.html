<!DOCTYPE html>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>ABYSSAL RECOIL // Presión Crítica</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #02050a;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      background: #050b14;
      cursor: none;
      touch-action: none;
      box-shadow: 0 0 70px rgba(46, 230, 255, .12);
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>
  <script>
    (() => {
      'use strict';

      /* =====================================================================
         ABYSSAL RECOIL // Presión Crítica
         Roguelike cenital estilo "boomer shooter" - Horror cósmico abisal
         Un solo archivo: HTML + CSS + JS vanilla (Canvas 2D + Web Audio)
         ===================================================================== */

      /* ---------------------------------------------------------------------
         0. CONSTANTES, UTILIDADES Y CANVAS
         --------------------------------------------------------------------- */
      const W = 1280, H = 720, WALL = 48, TAU = Math.PI * 2;
      const FLOORS = 3, ROOMS = 4;               // 3 sectores, 4 salas cada uno (la 4ª es jefe)
      const SAVE_KEY = 'abyssal_recoil_scores_v1';

      const THEMES = [
        { name: 'ZONA DE MAREA', accent: '#2ee6ff', accent2: '#37ffb0', floor: '#050b14', wall: '#13233b' },
        { name: 'CÁMARAS TÓXICAS', accent: '#7dff6a', accent2: '#ffe94a', floor: '#04120d', wall: '#14301f' },
        { name: 'LA FOSA ABISAL', accent: '#ff4fd8', accent2: '#ff3b4a', floor: '#0e0716', wall: '#2a1236' }
      ];

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      let scale = 1;
      function resize() {
        const k = Math.min(window.innerWidth / W, window.innerHeight / H);
        const cw = Math.max(320, Math.floor(W * k)), ch = Math.max(180, Math.floor(H * k));
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
        canvas.width = Math.floor(cw * dpr); canvas.height = Math.floor(ch * dpr);
        scale = canvas.width / W;
      }
      window.addEventListener('resize', resize); resize();

      const rand = (a, b) => a + Math.random() * (b - a);
      const randi = (a, b) => Math.floor(rand(a, b + 1));
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const lerp = (a, b, t) => a + (b - a) * t;
      const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
      const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
      const pick = a => a[Math.floor(Math.random() * a.length)];
      const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);

      /* Canvas auxiliares: iluminación (baja resolución) y efectos fijos (viñeta + scanlines) */
      const LW = 640, LH = 360;
      const lightCv = document.createElement('canvas'); lightCv.width = LW; lightCv.height = LH;
      const lctx = lightCv.getContext('2d');
      const fxCv = document.createElement('canvas'); fxCv.width = W; fxCv.height = H;
      (function () {
        const g = fxCv.getContext('2d');
        const gr = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.65);
        gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,6,0.75)');
        g.fillStyle = gr; g.fillRect(0, 0, W, H);
        g.fillStyle = 'rgba(0,0,0,0.12)';
        for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
      })();

      /* Sprites de brillo (glow) cacheados por color hexadecimal de 6 dígitos */
      const glowCache = {};
      function glowSprite(color) {
        if (glowCache[color]) return glowCache[color];
        const c = document.createElement('canvas'); c.width = c.height = 128;
        const g = c.getContext('2d');
        const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        gr.addColorStop(0, color + 'ff'); gr.addColorStop(0.3, color + '66'); gr.addColorStop(1, color + '00');
        g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
        glowCache[color] = c; return c;
      }
      let glowQ = [];
      function addGlow(x, y, r, color, a) { glowQ.push({ x, y, r, color, a: a === undefined ? 1 : a }); }

      /* ---------------------------------------------------------------------
         1. ENTRADA (teclado y mouse)
         --------------------------------------------------------------------- */
      const keys = {}, pressed = {};
      const mouse = { x: W / 2, y: H / 2, l: false, r: false, lp: false, rp: false };
      let wheelDir = 0;
      window.addEventListener('keydown', e => {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
        if (!keys[e.code]) pressed[e.code] = true;
        keys[e.code] = true;
        AudioSys.init(); AudioSys.resume();
      });
      window.addEventListener('keyup', e => { keys[e.code] = false; });
      function setMouse(e) {
        const r = canvas.getBoundingClientRect();
        mouse.x = (e.clientX - r.left) * W / r.width;
        mouse.y = (e.clientY - r.top) * H / r.height;
      }
      window.addEventListener('mousemove', setMouse);
      canvas.addEventListener('mousedown', e => {
        setMouse(e); AudioSys.init(); AudioSys.resume();
        if (e.button === 0) { mouse.l = true; mouse.lp = true; }
        if (e.button === 2) { mouse.r = true; mouse.rp = true; }
        e.preventDefault();
      });
      window.addEventListener('mouseup', e => { if (e.button === 0) mouse.l = false; if (e.button === 2) mouse.r = false; });
      canvas.addEventListener('contextmenu', e => e.preventDefault());
      canvas.addEventListener('wheel', e => { e.preventDefault(); wheelDir = Math.sign(e.deltaY); }, { passive: false });
      window.addEventListener('blur', () => {
        for (const k in keys) keys[k] = false;
        mouse.l = mouse.r = false;
        if (state === 'playing') state = 'paused';
      });

      /* ---------------------------------------------------------------------
         2. AUDIO SINTÉTICO (Web Audio API, sin archivos externos)
         --------------------------------------------------------------------- */
      const AudioSys = {
        ctx: null, master: null, noiseBuf: null, muted: false, last: {},
        gaps: { acid: 75, hit: 45, kill: 60, pickup: 60, ui: 40, pin: 80, boom: 40 },
        init() {
          if (this.ctx) return;
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            this.ctx = new AC();
            this.master = this.ctx.createGain();
            this.master.gain.value = this.muted ? 0 : 0.55;
            this.master.connect(this.ctx.destination);
            const len = this.ctx.sampleRate, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
            this.noiseBuf = buf;
            this.startAmbient();
          } catch (err) { this.ctx = null; }
        },
        resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
        toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.55; },
        tone(type, f0, f1, dur, vol, delay) {
          if (!this.ctx || this.muted) return;
          const c = this.ctx, t = c.currentTime + (delay || 0);
          const o = c.createOscillator(), g = c.createGain();
          o.type = type;
          o.frequency.setValueAtTime(Math.max(20, f0), t);
          o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(g); g.connect(this.master);
          o.start(t); o.stop(t + dur + 0.03);
        },
        noise(dur, vol, ftype, f0, f1, delay) {
          if (!this.ctx || this.muted || !this.noiseBuf) return;
          const c = this.ctx, t = c.currentTime + (delay || 0);
          const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
          const f = c.createBiquadFilter(); f.type = ftype; f.Q.value = 1.1;
          f.frequency.setValueAtTime(Math.max(20, f0), t);
          f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
          const g = c.createGain();
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          s.connect(f); f.connect(g); g.connect(this.master);
          s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
        },
        sfx(n, a) {
          if (!this.ctx || this.muted) return;
          const now = performance.now(), gap = this.gaps[n] || 0;
          if (now - (this.last[n] || 0) < gap) return;
          this.last[n] = now;
          const f = this.lib[n]; if (f) f.call(this, a);
        },
        startAmbient() {
          const c = this.ctx;
          const g = c.createGain(); g.gain.value = 0.05;
          const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180;
          [41, 62.5, 83].forEach((fr, i) => {
            const o = c.createOscillator(); o.type = i === 0 ? 'sawtooth' : 'sine';
            o.frequency.value = fr; o.detune.value = i * 4; o.connect(lp); o.start();
          });
          const lfo = c.createOscillator(); lfo.frequency.value = 0.13;
          const lg = c.createGain(); lg.gain.value = 0.02; lfo.connect(lg); lg.connect(g.gain); lfo.start();
          lp.connect(g); g.connect(this.master);
        },
        lib: {
          harpoon() { this.noise(0.25, 0.5, 'bandpass', 2200, 300); this.tone('square', 180, 40, 0.3, 0.32); this.tone('sawtooth', 900, 200, 0.12, 0.12); },
          acid() { this.noise(0.07, 0.16, 'highpass', 3200, 1500); this.tone('sawtooth', 300 + Math.random() * 90, 110, 0.07, 0.05); },
          flare() { this.tone('triangle', 500, 1500, 0.35, 0.2); this.noise(0.3, 0.12, 'bandpass', 3000, 6000); },
          tether() { this.tone('sawtooth', 100, 800, 0.25, 0.25); this.noise(0.2, 0.2, 'highpass', 2000, 5000); },
          boom(big) { this.noise(big ? 0.9 : 0.5, big ? 0.7 : 0.5, 'lowpass', big ? 1500 : 2200, big ? 60 : 100); this.tone('sine', big ? 90 : 130, 30, big ? 0.8 : 0.4, 0.6); },
          dash() { this.noise(0.35, 0.35, 'bandpass', 400, 2400); for (let i = 0; i < 4; i++) this.tone('sine', 400 + Math.random() * 600, 900 + Math.random() * 800, 0.09, 0.09, i * 0.04); },
          pop() { this.tone('sine', 500, 1400, 0.06, 0.1); },
          hit() { this.tone('square', 220, 80, 0.08, 0.12); },
          kill() { this.noise(0.25, 0.3, 'lowpass', 900, 200); this.tone('sine', 160, 50, 0.2, 0.3); },
          hurt() { this.noise(0.3, 0.6, 'lowpass', 600, 100); this.tone('sawtooth', 120, 40, 0.3, 0.4); },
          shield() { this.tone('triangle', 800, 300, 0.3, 0.3); this.noise(0.15, 0.2, 'highpass', 3000, 1000); },
          pickup() { this.tone('sine', 600, 1200, 0.15, 0.2); this.tone('sine', 900, 1800, 0.15, 0.2, 0.07); },
          alarm() { this.tone('square', 880, 880, 0.12, 0.1); this.tone('square', 660, 660, 0.12, 0.1, 0.16); },
          ui() { this.tone('square', 600, 900, 0.06, 0.08); },
          upgrade() { [0, 1, 2, 3].forEach(i => this.tone('triangle', 400 * Math.pow(1.25, i), 400 * Math.pow(1.25, i) * 1.5, 0.18, 0.2, i * 0.07)); },
          spawn() { this.tone('sawtooth', 80, 240, 0.4, 0.12); },
          pin() { this.noise(0.15, 0.4, 'bandpass', 1000, 400); this.tone('square', 90, 50, 0.15, 0.3); },
          roar() { this.tone('sawtooth', 70, 35, 1.2, 0.45); this.noise(1, 0.3, 'lowpass', 400, 80); },
          ping() { this.tone('sine', 1300, 1250, 1.2, 0.07); },
          win() { [0, 1, 2, 3, 4].forEach(i => this.tone('triangle', 330 * Math.pow(1.2, i), 330 * Math.pow(1.2, i), 0.35, 0.22, i * 0.12)); },
          lose() { this.tone('sawtooth', 200, 30, 1.6, 0.4); this.noise(1.4, 0.4, 'lowpass', 800, 40); }
        }
      };

      /* ---------------------------------------------------------------------
         3. ESTADO GLOBAL
         --------------------------------------------------------------------- */
      let state = 'menu';       // menu | playing | paused | upgrade | gameover | victory
      let stateT = 0, time = 0, runTime = 0;
      let P = null;             // jugador
      let enemies = [], bullets = [], ebullets = [], parts = [], clouds = [], flares = [], pools = [];
      let pickups = [], texts = [], pings = [], lights = [], obstacles = [], motes = [];
      let secret = null;
      let floorN = 1, roomN = 1, score = 0, kills = 0, combo = 0, comboT = 0;
      let rs = 'intro', introT = 0, clearT = 0, waveQueue = [], doorOpen = 0;
      let shakeMag = 0, hitstop = 0, hurtFlash = 0, fade = 0, banner = null, hint = 0, ambPing = 8;
      let cards = [], bgCv = null, highScores = [];
      const hintTexts = [];

      /* Mejoras (Mutaciones Abisales) */
      const UPS = [
        {
          id: 'shark', name: 'PIEL DE TIBURÓN ABISAL', max: 2, col: '#7ad7ff', icon: 'shield',
          desc: 'Una capa de escamas dentadas absorbe el siguiente golpe. Se regenera al entrar en cada sala.', apply() { P.shield++; }
        },
        {
          id: 'acid', name: 'ÁCIDO REACTIVO', max: 1, col: '#7dff6a', icon: 'drop',
          desc: 'Las nubes de burbujas del Dash queman y ralentizan a los enemigos, y al colapsar dejan un charco corrosivo.'
        },
        {
          id: 'sonar', name: 'RESONANCIA DEL SONAR', max: 1, col: '#2ee6ff', icon: 'sonar',
          desc: 'Al lanzar la bengala emites un pulso: revela a todos los enemigos en la oscuridad y delata cachés secretas.'
        },
        {
          id: 'adren', name: 'ADRENALINA DE PRESIÓN', max: 2, col: '#ff5a5a', icon: 'pulse',
          desc: 'Cuanta menos vida tengas, más rápido recargas y te mueves.'
        },
        {
          id: 'harpoon', name: 'ARPÓN HIPERBÁRICO', max: 3, col: '#9fd0ff', icon: 'harpoon',
          desc: 'Arpón +30% de daño y 15% más rápido de recargar.'
        },
        {
          id: 'chamber', name: 'CÁMARA SOBREPRESURIZADA', max: 3, col: '#b6ff3b', icon: 'flask',
          desc: 'Ácido +25% de daño y +40 de capacidad del depósito.', apply() { P.ammoMax += 40; P.ammo = P.ammoMax; }
        },
        {
          id: 'hull', name: 'CASCO REFORZADO', max: 3, col: '#ff8fa3', icon: 'plus',
          desc: 'Integridad máxima +30 y recuperas 30 de vida.', apply() { P.maxHp += 30; P.hp = Math.min(P.maxHp, P.hp + 30); }
        },
        {
          id: 'thrust', name: 'IMPULSORES HIDRÁULICOS', max: 3, col: '#5ad0ff', icon: 'wind',
          desc: 'Dash 25% más rápido de recargar y genera menos sobrepresión.'
        },
        {
          id: 'implo', name: 'NÚCLEO DE IMPLOSIÓN', max: 3, col: '#ffb13b', icon: 'burst',
          desc: 'El colapso de las burbujas tiene +35% de radio y +50% de daño.'
        },
        {
          id: 'leech', name: 'SANGUIJUELA ABISAL', max: 3, col: '#c46bff', icon: 'fang',
          desc: 'Cada abominación que mates te cura 3 de vida.'
        },
        {
          id: 'flarex', name: 'BENGALA INCANDESCENTE', max: 2, col: '#e8ff4a', icon: 'flare',
          desc: 'La bengala dura +60% y se recarga 30% más rápido.'
        },
        {
          id: 'cable', name: 'CABLE DE TITANIO', max: 2, col: '#7dff6a', icon: 'cable',
          desc: 'La explosión del cable hace +60% de daño y cura +50% más.'
        }
      ];

      /* Datos de enemigos */
      const ET = {
        stalker: { name: 'MERODEADOR TENTACULAR', hp: 42, speed: 170, r: 13, dmg: 12, score: 100, color: '#37ffb0', cost: 1 },
        tank: { name: 'TANQUE CAPARAZÓN', hp: 230, speed: 72, r: 23, dmg: 26, score: 250, color: '#ffd23f', cost: 3 },
        drone: { name: 'C-DRON', hp: 55, speed: 110, r: 12, dmg: 0, score: 150, color: '#2ee6ff', cost: 1.5 },
        bomber: { name: 'MEDUSA BOMBA', hp: 80, speed: 120, r: 14, dmg: 0, score: 260, color: '#ffb347', cost: 2.5 },
        phantom: { name: 'ESPECTRO DEL FONDO', hp: 70, speed: 140, r: 13, dmg: 0, score: 300, color: '#9fd8ff', cost: 3 },
        bait: { name: 'CARNADA', hp: 30, speed: 0, r: 11, dmg: 0, score: 0, color: '#ff5a7a', cost: 99 },
        spitter: { name: 'ESCUPIDOR DE PERDIGONES', hp: 60, speed: 95, r: 14, dmg: 0, score: 180, color: '#ff8a3b', cost: 2 },
        dodger: { name: 'ANGUILA ESQUIVA', hp: 48, speed: 150, r: 12, dmg: 10, score: 200, color: '#c46bff', cost: 2 },
        guardian: { name: 'GUARDIÁN COLMENA', hp: 160, speed: 80, r: 20, dmg: 0, score: 300, color: '#6bb8ff', cost: 3.5 },
        boss: { name: 'LEVIATÁN', hp: 900, speed: 70, r: 54, dmg: 20, score: 2000, color: '#ff4fd8', cost: 0 }
      };
      let organs = 0, miniRoom = false, inMini = false, sidePortal = null, infinite = false, loop = 0, xwList = [], xcd = 0;
      const chm = id => (P && P.ch && P.ch[id]) || 0;
      const CH = [
        { id: 'quick', name: 'GLÁNDULA FRENÉTICA', col: '#ff5a5a', icon: 'pulse', desc: 'Recarga y cadencia +35%.' },
        { id: 'might', name: 'COLMILLO DE ABISMO', col: '#ffb13b', icon: 'burst', desc: 'Todo tu daño +30%.' },
        { id: 'greed', name: 'ESTÓMAGO CODICIOSO', col: '#ff8fa3', icon: 'fang', desc: 'Los enemigos sueltan más órganos.' },
        { id: 'swift', name: 'ALETAS DE MANTA', col: '#5ad0ff', icon: 'wind', desc: 'Velocidad de movimiento +15%.' },
        { id: 'vital', name: 'CORAZÓN DOBLE', col: '#7dff6a', icon: 'plus', desc: '+60 de vida máxima y curación total.' }
      ];
      let shopItems = [], shopNear = null, shopExit = false, introDark = 0;
      CH.push({ id: 'plate', name: 'PLACA DE CASCO', col: '#7ad7ff', icon: 'shield', desc: '+1 escudo extra al entrar en cada sala.' });
      CH.push({ id: 'vamp', name: 'COLMILLOS VAMPÍRICOS', col: '#c46bff', icon: 'fang', desc: 'Cada baja te cura 6 de vida.' });
      CH.push({ id: 'anchor', name: 'ANCLA GRAVITATORIA', col: '#b66bff', icon: 'burst', weapon: true, desc: '[C] Lanza un ancla que atrae a los enemigos y colapsa. [V] cambia de arma.' });
      CH.push({ id: 'medusa', name: 'LANZAMEDUSAS', col: '#7affd8', icon: 'drop', weapon: true, desc: '[C] Medusa que al tocar un enemigo descarga rayos en cadena. [V] cambia de arma.' });
      const BOSS_NAMES = ['LEVIATÁN HUÉRFANO', 'COLOSO DE LA FOSA', 'EL HAMBRE DEL FONDO'];
      const BOSS_HP = [4000, 7500, 12000];

      /* Puntajes (localStorage) */
      function loadScores() { try { const a = JSON.parse(localStorage.getItem(SAVE_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
      function saveScore(win) {
        try {
          const arr = loadScores();
          arr.push({ score, floor: floorN, room: roomN, kills, win, date: Date.now() });
          arr.sort((a, b) => b.score - a.score);
          localStorage.setItem(SAVE_KEY, JSON.stringify(arr.slice(0, 8)));
        } catch (e) { /* sin almacenamiento disponible */ }
        highScores = loadScores();
      }
      highScores = loadScores();

      /* ---------------------------------------------------------------------
         4. PARTÍCULAS Y EFECTOS ("JUICE")
         --------------------------------------------------------------------- */
      const MAXP = 1500;
      function addP(p) { if (parts.length < MAXP) { p.max = p.life; parts.push(p); } }
      function spark(x, y, n, color, spd, ang, spread) {
        spd = spd || 300; spread = spread === undefined ? TAU : spread;
        for (let i = 0; i < n; i++) {
          const a = (ang === undefined || ang === null) ? rand(0, TAU) : ang + rand(-spread / 2, spread / 2);
          const s = rand(spd * 0.3, spd);
          addP({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.15, 0.45), size: rand(1, 2.4), color, drag: 3 });
        }
      }
      function bubbles(x, y, n, spread) {
        spread = spread || 20;
        for (let i = 0; i < n; i++)
          addP({
            kind: 'bubble', x: x + rand(-spread, spread), y: y + rand(-spread, spread), vx: rand(-20, 20), vy: rand(-80, -20),
            size: rand(2, 7), life: rand(0.8, 2.2), buoy: -50, ph: rand(0, 6), drag: 0.5
          });
      }
      function blood(x, y, n, color, ang, spd) {
        spd = spd || 260;
        for (let i = 0; i < n; i++) {
          const a = (ang === undefined || ang === null) ? rand(0, TAU) : ang + rand(-0.8, 0.8);
          const s = rand(spd * 0.2, spd);
          addP({ kind: 'blood', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 1.1), size: rand(2, 5.5), color, drag: 2.6 });
        }
      }
      function ring(x, y, r, color, life, w) { addP({ kind: 'ring', x, y, vx: 0, vy: 0, size: r, life: life || 0.4, color, w: w || 3 }); }
      function flashFx(x, y, r, color) { addP({ kind: 'flash', x, y, vx: 0, vy: 0, size: r, life: 0.28, color }); }
      function boomFx(x, y, r, color, blood1) {
        flashFx(x, y, r * 1.5, color);
        ring(x, y, r, color, 0.45, 4);
        ring(x, y, r * 0.6, '#ffffff', 0.3, 2);
        spark(x, y, 18, color, r * 4);
        bubbles(x, y, 12, r * 0.5);
        if (blood1) blood(x, y, 14, blood1, null, r * 3);
      }
      function shake(a) { shakeMag = Math.min(24, Math.max(shakeMag, a)); }

      /* ---------------------------------------------------------------------

      function circleRect(cx, cy, r, rc) {
        const nx = clamp(cx, rc.x, rc.x + rc.w), ny = clamp(cy, rc.y, rc.y + rc.h);

        for (let i = 0; i < n; i++) {

          if (o.x < minx) { o.x = minx; hit = true; } else if (o.x > maxx) { o.x = maxx; hit = true; }
          if (o.y < miny) { o.y = miny; hit = true; } else if (o.y > maxy) { o.y = maxy; hit = true; }

        return false;

      /* ---------------------------------------------------------------------

      function hurtEnemy(e, dmg, o) {

        if (e.marked > 0) { m *= 1.75; crit = true; }
        m *= 1 + 0.08 * e.corrode; m *= 1 + 0.3 * chm('might'); if (e.vuln > 0) m *= 2.2;
        if (e.type !== 'guardian') for (const g of enemies) if (g.type === 'guardian' && !g.dead && g.spawnT <= 0 && dist(g.x, g.y, e.x, e.y) < 190) { m *= 0.6; break; }
        let blocked = false;
        if (e.type === 'tank' && !o.ignoreArmor && o.ang !== undefined && e.corrode < 3 && e.pinned === null) {

      const actv = e => !e.dead && e.spawnT <= 0 && !e.impaled && !e.pinned && !e.pull;

      function steerDir(e, ang, spd, acc, dt) {

      function enemyShoot(e, ang, spd, dmg, fr) {

      }

      function updateEnemy(e, dt) {
        e.t += dt;
        if (e.spawnT > 0) { e.spawnT -= dt; if (e.spawnT <= 0) { ring(e.x, e.y, e.r * 3, ET[e.type].color, 0.35, 3); spark(e.x, e.y, 10, ET[e.type].color, 250); if (e.boss) bossEntrance(e); } return; }
        e.flash = Math.max(0, e.flash - dt); e.hitCd = Math.max(0, e.hitCd - dt); e.sideT = Math.max(0, e.sideT - dt);
        if (e.slow > 0) e.slow -= dt; if (e.blind > 0) e.blind -= dt; if (e.marked > 0) e.marked -= dt; if (e.stun > 0) e.stun -= dt;
        if (e.corrode > 0) { e.corrodeT -= dt; if (e.corrodeT <= 0) { e.corrode--; e.corrodeT = 1.2; } }
        if (e.burn > 0) {
          e.burn -= dt; e.hp -= 14 * dt;
          if (Math.random() < dt * 16) addP({ kind: 'ember', x: e.x + rand(-e.r, e.r), y: e.y + rand(-e.r, e.r), vx: rand(-20, 20), vy: -rand(40, 90), life: 0.5, size: 3, color: '#ff9a3b' });

        }
        if (e.pull) {
          e.pullT -= dt;

          e.x += Math.cos(a) * 1900 * dt; e.y += Math.sin(a) * 1900 * dt;
          addP({ kind: 'ghost', x: e.x, y: e.y, vx: 0, vy: 0, life: 0.2, size: e.r, color: '#7dff6a' });
          if (dist(e.x, e.y, P.x, P.y) < e.r + P.r + 4 || e.pullT <= 0) cableExplode(e);
          return;
        }
        if (e.impaled) { e.vx = e.vy = 0; return; }
        if (e.pinned) { e.vx = e.vy = 0; if (Math.random() < dt * 8) blood(e.x, e.y, 1, '#1fa89a', null, 60); return; }
        if (e.boss) { updateBoss(e, dt); return; }
        if (e.mini) { updateMini(e, dt); return; }

        // selección de objetivo
        let tx = P.x, ty = P.y, tgt = null, wander = false;

            e.face = e.cA; steerDir(e, e.cA, e.speed * 3.4, 6000, dt);

const MP_SERVER = "https://abyssal-redo-server.vicentevaldebenito.workers.dev";

const MP = {
    socket: null,
    room: null,
    id: null,
    players: 0,
    connected: false
};

// Crear interfaz
const mpUI = document.createElement("div");

mpUI.id = "abyssal-multiplayer";
mpUI.innerHTML = `
<div style="
    position:fixed; inset:0; z-index:99999;
    background:rgba(0,5,14,.96);
    display:flex; align-items:center; justify-content:center;
    font-family:Arial,sans-serif; color:white;
">
  <div style="
      width:360px; max-width:90%;
      padding:30px; text-align:center;
      background:#071526;
      border:1px solid #2ee6ff;
      box-shadow:0 0 35px #2ee6ff33;
  ">
    <h1 style="color:#2ee6ff;letter-spacing:4px">
      ABYSSAL REDO
    </h1>
    <h3>MULTIJUGADOR</h3>

    <button id="mp-create">CREAR SALA</button>

    <input id="mp-code"
      placeholder="CÓDIGO DE SALA"
      maxlength="6"
      style="
        width:90%; padding:12px; margin:15px 0;
        text-align:center; text-transform:uppercase;
        background:#020b15; color:white;
        border:1px solid #2ee6ff;
      ">

    <button id="mp-join">UNIRSE A SALA</button>

    <p id="mp-status" style="color:#8fb8d8">
      DESCONECTADO
    </p>

    <p id="mp-room"></p>
    <p id="mp-count"></p>

    <button id="mp-solo">JUGAR SOLO</button>
  </div>
</div>
`;

document.body.appendChild(mpUI);

// Estilo de botones
mpUI.querySelectorAll("button").forEach(button => {
    button.style.cssText = `
        width:100%;
        padding:13px;
        margin:7px 0;
        background:#092b40;
        color:#2ee6ff;
        border:1px solid #2ee6ff;
        cursor:pointer;
        font-weight:bold;
        letter-spacing:2px;
    `;
});

const mpStatus = document.getElementById("mp-status");

function mpMessage(message) {
    mpStatus.textContent = message;
}

function mpConnect(code) {
    if (MP.socket) {
        MP.socket.close();
    }

    mpMessage("CONECTANDO...");

    const wsURL =
        MP_SERVER.replace("https://", "wss://") +
        "/join/" + encodeURIComponent(code);

    const socket = new WebSocket(wsURL);
    MP.socket = socket;

    socket.onopen = () => {
        MP.connected = true;
        MP.room = code;
        mpMessage("CONECTADO A LA SALA");
        document.getElementById("mp-room").textContent =
            "SALA: " + code;
    };

    socket.onmessage = event => {
        let data;

        try {
            data = JSON.parse(event.data);
        } catch {
            return;
        }

        if (data.type === "welcome") {
            MP.players = data.players;
            document.getElementById("mp-count").textContent =
                "JUGADORES: " + data.players + "/4";
        }

        if (data.type === "player-joined") {
            MP.players++;
            document.getElementById("mp-count").textContent =
                "JUGADORES: " + MP.players + "/4";
        }

        if (data.type === "player-left") {
            MP.players = Math.max(1, MP.players - 1);
            document.getElementById("mp-count").textContent =
                "JUGADORES: " + MP.players + "/4";
        }
    };

    socket.onerror = () => {
        mpMessage("ERROR DE CONEXIÓN");
    };

    socket.onclose = () => {
        MP.connected = false;
        MP.players = 0;
        mpMessage("DESCONECTADO");
        document.getElementById("mp-count").textContent = "";
    };
}

// Crear sala
document.getElementById("mp-create").onclick = async () => {
    try {
        mpMessage("CREANDO SALA...");

        const response = await fetch(MP_SERVER + "/create");

        if (!response.ok) {
            throw new Error("No se pudo crear la sala");
        }

        const data = await response.json();

        document.getElementById("mp-code").value = data.code;

        mpConnect(data.code);

    } catch (error) {
        mpMessage("ERROR AL CREAR SALA");
        console.error(error);
    }
};

// Unirse a sala
document.getElementById("mp-join").onclick = () => {
    const code = document.getElementById("mp-code")
        .value.trim().toUpperCase();

    if (!/^[A-F0-9]{6}$/.test(code)) {
        mpMessage("CÓDIGO INVÁLIDO");
        return;
    }

    mpConnect(code);
};

// Jugar solo
document.getElementById("mp-solo").onclick = () => {
    if (MP.socket) MP.socket.close();
    mpUI.remove();
};

console.log("ABYSSAL REDO MULTIPLAYER LOADED");
