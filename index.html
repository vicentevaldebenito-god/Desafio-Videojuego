<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>ABYSSAL RECOIL // Presión Crítica</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #02050a;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overscroll-behavior: none;
    }

    canvas {
      display: block;
      background: #050b14;
      cursor: none;
      touch-action: none;
      box-shadow: 0 0 70px rgba(46, 230, 255, .12);
    }
    @media (pointer: coarse) {
      html, body { touch-action: none; }
      canvas { cursor: default; }
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>
  <script>
    (() => {
      'use strict';

      /* =====================================================================
         ABYSSAL RECOIL // Presión Crítica
         Roguelike cenital estilo "boomer shooter" - Horror cósmico abisal
         Un solo archivo: HTML + CSS + JS vanilla (Canvas 2D + Web Audio)
         ===================================================================== */

      /* ---------------------------------------------------------------------
         0. CONSTANTES, UTILIDADES Y CANVAS
         --------------------------------------------------------------------- */
      const W = 1280, H = 720, WALL = 48, TAU = Math.PI * 2;
      const FLOORS = 8, ROOMS = 4;               // 3 sectores, 4 salas cada uno (la 4ª es jefe)
      const SAVE_KEY = 'abyssal_recoil_scores_v1';

      const THEMES = [
        { name: 'ZONA DE MAREA', accent: '#2ee6ff', accent2: '#37ffb0', floor: '#050b14', wall: '#13233b' },
        { name: 'CÁMARAS TÓXICAS', accent: '#7dff6a', accent2: '#ffe94a', floor: '#04120d', wall: '#14301f' },
        { name: 'LA FOSA ABISAL', accent: '#ff4fd8', accent2: '#ff3b4a', floor: '#0e0716', wall: '#2a1236' }
      ];

      const canvas = document.getElementById('game');
      let amalMusic = null, amalMusicUrl = null;
      const amalMusicInput = document.createElement('input'); amalMusicInput.type='file'; amalMusicInput.accept='audio/*'; amalMusicInput.style.display='none'; document.body.appendChild(amalMusicInput);
      const amalMusicButton = document.createElement('button'); amalMusicButton.textContent='♫ CARGAR TEMA'; amalMusicButton.style.cssText='display:none;position:fixed;z-index:30;top:14px;right:14px;padding:10px 14px;border:1px solid #7bd8ef;background:rgba(3,18,30,.9);color:#d9f8ff;font:700 12px Arial;letter-spacing:1px;border-radius:5px;cursor:pointer'; document.body.appendChild(amalMusicButton);
      amalMusicButton.addEventListener('click',()=>amalMusicInput.click());
      amalMusicInput.addEventListener('change',()=>{const f=amalMusicInput.files&&amalMusicInput.files[0];if(!f)return;if(amalMusicUrl)URL.revokeObjectURL(amalMusicUrl);amalMusicUrl=URL.createObjectURL(f);if(!amalMusic){amalMusic=new Audio();amalMusic.loop=true;amalMusic.volume=.72;}amalMusic.src=amalMusicUrl;amalMusic.play().then(()=>{if(amalEncounter&&amalEncounter.phase!=='arena')amalMusic.pause();}).catch(()=>{});});
      const ctx = canvas.getContext('2d');
      const MOBILE = (('ontouchstart' in window) || navigator.maxTouchPoints > 0) &&
        (window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0);
      let scale = 1;
      function resize() {
        const k = Math.min(window.innerWidth / W, window.innerHeight / H);
        const cw = Math.max(320, Math.floor(W * k)), ch = Math.max(180, Math.floor(H * k));
        // En móviles limitamos la resolución interna para aliviar GPU y batería.
        const dpr = Math.min(window.devicePixelRatio || 1, MOBILE ? 1.35 : 2);
        canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
        canvas.width = Math.floor(cw * dpr); canvas.height = Math.floor(ch * dpr);
        scale = canvas.width / W;
      }
      window.addEventListener('resize', resize); resize();

      const rand = (a, b) => a + Math.random() * (b - a);
      const randi = (a, b) => Math.floor(rand(a, b + 1));
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const lerp = (a, b, t) => a + (b - a) * t;
      const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
      const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
      const pick = a => a[Math.floor(Math.random() * a.length)];
      const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);

      /* Canvas auxiliares: iluminación (baja resolución) y efectos fijos (viñeta + scanlines) */
      const LW = 640, LH = 360;
      const lightCv = document.createElement('canvas'); lightCv.width = LW; lightCv.height = LH;
      const lctx = lightCv.getContext('2d');
      const fxCv = document.createElement('canvas'); fxCv.width = W; fxCv.height = H;
      (function () {
        const g = fxCv.getContext('2d');
        const gr = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.65);
        gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,6,0.75)');
        g.fillStyle = gr; g.fillRect(0, 0, W, H);
        g.fillStyle = 'rgba(0,0,0,0.12)';
        for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
      })();

      /* Sprites de brillo (glow) cacheados por color hexadecimal de 6 dígitos */
      const glowCache = {};
      function glowSprite(color) {
        if (glowCache[color]) return glowCache[color];
        const c = document.createElement('canvas'); c.width = c.height = 128;
        const g = c.getContext('2d');
        const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        gr.addColorStop(0, color + 'ff'); gr.addColorStop(0.3, color + '66'); gr.addColorStop(1, color + '00');
        g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
        glowCache[color] = c; return c;
      }
      let glowQ = [];
      function addGlow(x, y, r, color, a) { glowQ.push({ x, y, r, color, a: a === undefined ? 1 : a }); }

      /* ---------------------------------------------------------------------
         1. ENTRADA (teclado y mouse)
         --------------------------------------------------------------------- */
      const keys = {}, pressed = {};
      const mouse = { x: W / 2, y: H / 2, l: false, r: false, lp: false, rp: false };
      const touchPad = { moveId: null, specialId: null, dashId: null, interactId: null, weaponId: null, secondaryId: null, joyX: 0, joyY: 0, active: false };
      const amalCamera = { x: W / 2, y: H / 2, zoom: 0.62 };
      function amalCameraActive() { return !!(amalEncounter && ['corridor','awakening','materialize','arena'].includes(amalEncounter.phase)); }
      function amalBounds(){return {l:W/2-W*1.5,r:W/2+W*1.5,t:H/2-H*1.5,b:H/2+H*1.5};}
      function drawAmalCave(){
        if(!amalCameraActive())return;const B=amalBounds();ctx.save();ctx.fillStyle='#07131a';ctx.fillRect(B.l,B.t,B.r-B.l,B.b-B.t);
        const floor=ctx.createLinearGradient(0,B.t,0,B.b);floor.addColorStop(0,'#10232b');floor.addColorStop(.48,'#172a30');floor.addColorStop(1,'#09171d');ctx.fillStyle=floor;ctx.fillRect(B.l,B.t,B.r-B.l,B.b-B.t);
        for(let side=0;side<2;side++){const x=side?B.r:B.l;ctx.beginPath();ctx.moveTo(x,B.t);for(let y=B.t;y<=B.b+80;y+=90){const k=Math.sin(y*.013+side*2.4)*42+Math.sin(y*.037+side)*22;ctx.lineTo(x+(side?-1:1)*(105+k),y);}ctx.lineTo(x,B.b);ctx.closePath();ctx.fillStyle='#030b10';ctx.fill();ctx.strokeStyle='rgba(86,132,139,.36)';ctx.lineWidth=14;ctx.stroke();}
        for(let i=0;i<95;i++){const x=B.l+90+((i*7919)%(B.r-B.l-180)),y=B.t+((i*3571)%(B.b-B.t)),r=18+(i*17%58);ctx.beginPath();ctx.moveTo(x-r,y+r*.5);ctx.lineTo(x-r*.62,y-r*.55);ctx.lineTo(x+r*.1,y-r);ctx.lineTo(x+r,y-r*.15);ctx.lineTo(x+r*.7,y+r*.65);ctx.closePath();ctx.fillStyle=i%3?'rgba(28,48,52,.72)':'rgba(43,62,63,.62)';ctx.fill();ctx.strokeStyle='rgba(100,143,143,.12)';ctx.lineWidth=2;ctx.stroke();}
        // Huge rock columns and fossil-like arches in multiple depth layers.
        for(let i=0;i<18;i++){const x=B.l+((i*887)%(B.r-B.l)),y=B.t+((i*613)%(B.b-B.t)),w=55+(i*31%110),h=170+(i*47%250);ctx.fillStyle='rgba(3,12,17,.62)';ctx.beginPath();ctx.moveTo(x-w*.45,y+h*.5);ctx.lineTo(x-w*.6,y-h*.35);ctx.lineTo(x-w*.2,y-h*.55);ctx.lineTo(x+w*.25,y-h*.4);ctx.lineTo(x+w*.55,y+h*.45);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(104,143,142,.16)';ctx.lineWidth=5;ctx.stroke();}
        ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<24;i++){const x=B.l+150+((i*1543)%(B.r-B.l-300)),y=B.t+((i*977)%(B.b-B.t));ctx.strokeStyle=i%2?'rgba(48,174,177,.22)':'rgba(95,146,210,.2)';ctx.lineWidth=2+(i%3);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(i*2)*24,y+35+i%70);ctx.lineTo(x+Math.cos(i)*48,y+75+i%90);ctx.stroke();const g=ctx.createRadialGradient(x,y,2,x,y,90);g.addColorStop(0,'rgba(83,225,209,.16)');g.addColorStop(1,'rgba(83,225,209,0)');ctx.fillStyle=g;ctx.fillRect(x-90,y-90,180,180);}ctx.restore();
        for(let i=0;i<34;i++){const x=B.l+((i*233)%(B.r-B.l)),w=18+(i*13%38),len=45+(i*29%115);ctx.fillStyle='#071015';ctx.beginPath();if(i%2){ctx.moveTo(x-w,B.t);ctx.lineTo(x+w,B.t);ctx.lineTo(x+3,B.t+len);}else{ctx.moveTo(x-w,B.b);ctx.lineTo(x+w,B.b);ctx.lineTo(x-2,B.b-len);}ctx.closePath();ctx.fill();}
        ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<55;i++){const x=B.l+((i*617)%(B.r-B.l)),y=B.t+((i*379)%(B.b-B.t)),a=.18+.12*Math.sin(time*1.5+i);ctx.fillStyle='rgba(104,226,221,'+a+')';ctx.beginPath();ctx.arc(x,y,2+i%3,0,TAU);ctx.fill();}ctx.restore();
        const g=ctx.createRadialGradient(P.x,P.y,90,P.x,P.y,1250);g.addColorStop(0,'rgba(125,190,190,.16)');g.addColorStop(.58,'rgba(74,137,148,.09)');g.addColorStop(1,'rgba(4,12,17,0)');ctx.fillStyle=g;ctx.fillRect(B.l,B.t,B.r-B.l,B.b-B.t);ctx.restore();
      }
      function screenToWorld(x,y) { if (!amalCameraActive()) return {x,y}; const z=Math.max(.01,amalCamera.zoom); return {x:amalCamera.x+(x-W/2)/z,y:amalCamera.y+(y-H/2)/z}; }
      function worldToScreen(x,y) { if (!amalCameraActive()) return {x,y}; const z=amalCamera.zoom; return {x:W/2+(x-amalCamera.x)*z,y:H/2+(y-amalCamera.y)*z}; }
      function amalWorldBounds(pad=0){const b=amalBounds();return amalCameraActive()?{l:b.l+pad,r:b.r-pad,t:b.t+pad,b:b.b-pad}:{l:WALL+pad,r:W-WALL-pad,t:WALL+pad,b:H-WALL-pad};}
      function pointSegmentDistance(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1,t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1);return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));}
      function rayRoomEnd(x,y,a){const b=amalWorldBounds(4),dx=Math.cos(a),dy=Math.sin(a),ts=[];if(dx>1e-6)ts.push((b.r-x)/dx);if(dx< -1e-6)ts.push((b.l-x)/dx);if(dy>1e-6)ts.push((b.b-y)/dy);if(dy< -1e-6)ts.push((b.t-y)/dy);const t=Math.min(...ts.filter(v=>v>0));return {x:x+dx*(Number.isFinite(t)?t:2200),y:y+dy*(Number.isFinite(t)?t:2200)};}
      let mobileInteractPulse = false;
      let wheelDir = 0;
      function touchGamePoint(e) {
        const r = canvas.getBoundingClientRect();
        const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height; return screenToWorld(x,y);
      }
      function updateTouchMove(e) {
        const r = canvas.getBoundingClientRect(); const p = { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height }; const dx = p.x - 142, dy = p.y - 578;
        const len = Math.hypot(dx, dy), max = 68, k = len > max ? max / len : 1;
        touchPad.joyX = dx * k / max; touchPad.joyY = dy * k / max;
        touchPad.active = len > 8;
        keys.KeyA = touchPad.joyX < -0.18; keys.KeyD = touchPad.joyX > 0.18;
        keys.KeyW = touchPad.joyY < -0.18; keys.KeyS = touchPad.joyY > 0.18;
      }
      function clearTouchMove() {
        touchPad.moveId = null; touchPad.joyX = touchPad.joyY = 0; touchPad.active = false;
        keys.KeyA = keys.KeyD = keys.KeyW = keys.KeyS = false;
      }
      function drawTouchControls() {
        if (!MOBILE) return;
        ctx.save(); ctx.setTransform(scale, 0, 0, scale, 0, 0);
        const circle = (x,y,r,fill,stroke) => { ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=stroke; ctx.stroke(); };
        const touchButton = (x,y,w,h,label,color) => {
          ctx.fillStyle='rgba(4,18,32,.88)'; ctx.fillRect(x,y,w,h);
          ctx.strokeStyle=color; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,w-2,h-2);
          ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 14px Arial'; ctx.fillText(label,x+w/2,y+h/2);
        };
        if (state === 'menu') {
          if (mpOpen) { ctx.restore(); return; }
          if (!charMenu && !bestMenu && !optMenu && !tutMenu) {
            touchButton(150,615,220,54,'JUGAR','#7dff6a');
            touchButton(390,615,220,54,'PERSONAJES','#8fd8ff');
            touchButton(630,615,220,54,'LOGS','#ffe94a');
            touchButton(870,615,260,54,'MULTIJUGADOR','#2ee6ff');
          } else {
            touchButton(28,640,170,48,'VOLVER','#8fd8ff');
            if (charMenu && pendingStart) touchButton(440,635,400,48,'COMENZAR INMERSIÓN','#7dff6a');
          }
          ctx.restore(); return;
        }
        if (!P || !['playing','paused','upgrade','inv'].includes(state)) { ctx.restore(); return; }
        // Acceso rápido a pantalla completa, siempre visible durante la partida.
        circle(1220,48,27,'rgba(46,230,255,.14)','rgba(46,230,255,.65)');
        ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 18px Arial';
        ctx.fillStyle='#b8f4ff'; ctx.fillText(document.fullscreenElement ? '×' : '⛶',1220,48);
        if (state === 'playing' || state === 'inv' || state === 'upgrade') {
          circle(1145,48,27,'rgba(255,177,59,.16)','rgba(255,177,59,.8)');
          ctx.fillStyle='#ffd08a'; ctx.font='bold 13px Arial'; ctx.fillText('Ⅱ',1145,48);
        }
        if (state === 'paused') {
          touchButton(390,420,220,58,'REANUDAR','#7dff6a');
          touchButton(670,420,220,58,'MENÚ INICIO','#ff6b78');
          ctx.restore(); return;
        }
        circle(142,578,82,'rgba(4,20,34,.38)','rgba(110,220,255,.30)');
        circle(142 + touchPad.joyX*55,578 + touchPad.joyY*55,31,'rgba(46,230,255,.32)','rgba(150,235,255,.8)');
        circle(970,590,51,'rgba(255,177,59,.18)','rgba(255,177,59,.85)');
        circle(1090,590,57,'rgba(125,255,106,.18)','rgba(125,255,106,.8)');
        circle(1180,470,63,'rgba(46,230,255,.24)','rgba(46,230,255,.95)'); ctx.beginPath(); ctx.arc(1180,470,54,0,TAU); ctx.strokeStyle='rgba(184,244,255,.55)'; ctx.lineWidth=2; ctx.stroke();
        circle(970,455,43,'rgba(105,170,255,.18)','rgba(105,190,255,.85)'); circle(1080,455,43,'rgba(255,105,190,.18)','rgba(255,145,210,.85)');
        ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 15px Arial';
        ctx.fillStyle='#ffd08a'; ctx.fillText('DASH',970,590);
        const sharkDesperation=enemies.some(q=>q.boss&&q.state==='desp_algae'&&!q.despFinished);
        if(sharkDesperation){ctx.fillStyle='#ff7b82';ctx.font='bold 17px Arial';ctx.fillText('¡TOCA DASH REPETIDAMENTE!',970,515);}
        ctx.fillStyle='#baffc8'; ctx.fillText('ESPECIAL',1090,590);
        ctx.fillStyle='#b8f4ff'; ctx.font='bold 25px Arial'; ctx.fillText(state==='inv'?'CERRAR':'R',1180,462); ctx.font='bold 11px Arial'; ctx.fillText(state==='inv'?'INVENTARIO':'INTERACTUAR',1180,491);
        ctx.fillStyle='#b8dfff';ctx.font='bold 12px Arial';ctx.fillText('ARMA',970,455);ctx.fillStyle='#ffb5dc';ctx.fillText('SEC.',1080,455);
        ctx.fillStyle='rgba(180,225,245,.72)'; ctx.font='12px Arial'; ctx.fillText('MOVER',142,682);
        ctx.restore();
      }
      canvas.addEventListener('pointerdown', e => {
        if (!MOBILE) return;
        const p = touchGamePoint(e);
        AudioSys.init(); AudioSys.resume();
        if (state === 'menu' && !mpOpen) {
          if (charMenu || bestMenu || optMenu || tutMenu) {
            if (p.x < 210 && p.y > 620) {
              if (charMenu) { pressed.Escape = true; }
              else if (bestMenu) bestMenu = false;
              else if (optMenu) optMenu = false;
              else if (tutMenu) { tutMenu = false; tutPage = 0; }
            } else if (charMenu && pendingStart && p.x >= 430 && p.x <= 850 && p.y >= 625) {
              mouse.x = W/2; mouse.y = 645; mouse.lp = true; pressed.Enter = true;
            } else {
              mouse.x=p.x; mouse.y=p.y; mouse.lp=true;
            }
          } else if (p.y >= 605 && p.y <= 680) {
            if (p.x >= 140 && p.x <= 380) { infinite=false; pendingStart='norm'; charMenu=true; }
            else if (p.x >= 380 && p.x <= 620) charMenu=true;
            else if (p.x >= 620 && p.x <= 860) bestMenu=true;
            else if (p.x >= 860 && p.x <= 1145) mpToggle(true);
          } else { mouse.x=p.x; mouse.y=p.y; mouse.lp=true; }
        } else if (state === 'playing' && p.x >= 1105 && p.x <= 1178 && p.y < 88) {
          if (!MP.connected || MP.isHost) state='paused';
        } else if (state === 'inv' && p.x >= 1117 && p.x <= 1243 && p.y >= 407 && p.y <= 533) {
          pressed.Tab = true;
        } else if (state === 'paused' && p.y >= 400 && p.y <= 500) {
          if (p.x >= 370 && p.x <= 630) { if (!MP.connected || MP.isHost) state='playing'; }
          else if (p.x >= 650 && p.x <= 920) {
            if (MP.connected) mpLeaveRoom("HAS ABANDONADO LA SALA");
            mpToggle(false); state='menu';
          }
        } else if (p.x > 1178 && p.y < 88) {
          if (!document.fullscreenElement) {
            const enterFullscreen = document.documentElement.requestFullscreen || canvas.requestFullscreen;
            if (enterFullscreen) {
              try { const result = enterFullscreen.call(document.documentElement.requestFullscreen ? document.documentElement : canvas); if (result && result.catch) result.catch(() => {}); } catch (_) {}
            }
          } else if (document.exitFullscreen) {
            try { const result = document.exitFullscreen(); if (result && result.catch) result.catch(() => {}); } catch (_) {}
          }
        } else if (p.x < 300 && p.y > 390 && touchPad.moveId === null) {
          touchPad.moveId = e.pointerId; updateTouchMove(e);
        } else if (p.x > 900 && p.x <= 1035 && p.y > 520 && touchPad.dashId === null) {
          touchPad.dashId = e.pointerId; keys.Space = true; pressed.Space = true;
        } else if (p.x >= 925 && p.x <= 1015 && p.y >= 410 && p.y <= 500 && touchPad.weaponId === null) {
          touchPad.weaponId=e.pointerId; wheelDir=1;
        } else if (p.x >= 1035 && p.x <= 1125 && p.y >= 410 && p.y <= 500 && touchPad.secondaryId === null) {
          touchPad.secondaryId=e.pointerId; mouse.r=true; mouse.rp=true; pressed.KeyQ=true;
        } else if (p.x >= 1033 && p.x <= 1147 && p.y >= 533 && p.y <= 647 && touchPad.specialId === null) {
          touchPad.specialId = e.pointerId; pressed.KeyF = true;
        } else if (p.x >= 1117 && p.x <= 1243 && p.y >= 407 && p.y <= 533 && touchPad.interactId === null) {
          touchPad.interactId = e.pointerId;
          pressed.KeyR = true;
          if (MP && MP.connected && !MP.isHost && MP.socket && MP.socket.readyState === WebSocket.OPEN) {
            const boss=enemies.find(q=>q.boss && q.state==='desp_lights' && Array.isArray(q.despLights));
            if(boss){const near=boss.despLights.map((q,i)=>({i,d:dist(P.x,P.y,q.x,q.y)})).filter(q=>q.d<65).sort((a,b)=>a.d-b.d)[0];
              if(near)try{MP.socket.send(JSON.stringify({type:'boss-light-interact',id:MP.id,bossId:boss.netId,lightIndex:near.i,roomKey:mpRoomKey()}));}catch{}
            }
          }
        } else {
          // Tocar el resto de la pantalla sirve para seleccionar menús y cartas.
          mouse.x = p.x; mouse.y = p.y; mouse.lp = true;
        }
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        e.preventDefault();
      }, { passive:false });
      canvas.addEventListener('pointermove', e => {
        if (touchPad.moveId === e.pointerId) { updateTouchMove(e); e.preventDefault(); }
      }, { passive:false });
      const endTouchPointer = e => {
        if (touchPad.moveId === e.pointerId) clearTouchMove();
        if (touchPad.specialId === e.pointerId) { touchPad.specialId = null; }
        if (touchPad.dashId === e.pointerId) { touchPad.dashId = null; keys.Space = false; }
        if (touchPad.interactId === e.pointerId) touchPad.interactId = null;
        if (touchPad.weaponId === e.pointerId) touchPad.weaponId=null;

          else { const ne = spawnEnemy(t, pos.x, pos.y); if (loop >= 1 && t !== 'boss' && ne && Math.random() < Math.min(0.5, 0.1 + 0.12 * loop)) { const af = ['shield', 'volatile', 'regen', 'frenzy'][Math.floor(Math.random() * 4)]; ne.af = af; if (af === 'shield') ne.hp = ne.maxHp = ne.maxHp * 1.8; if (af === 'frenzy') ne.speed *= 1.4; } if (t === 'boss') { const b = enemies[enemies.length - 1]; b.spawnT = 0; b.orbit = 4.5; } }

      /* --- Dash con nube de burbujas --- */

      function collapseCloud(c) {
        if (c.dead) return;

          const d = dist(c.x, c.y, e.x, e.y);
          if (d < R + e.r) { const falloff = 1 - 0.5 * clamp(d / R, 0, 1); hurtEnemy(e, dmg * falloff, { ignoreArmor: true }); const a = Math.atan2(e.y-c.y,e.x-c.x); e.vx += Math.cos(a)*520; e.vy += Math.sin(a)*520; }
        }

      function areaDamage(x, y, R, dmg, kb) {

          const d = dist(x, y, e.x, e.y);
          if (d < R + e.r) {
            const f = 1 - 0.5 * clamp(d / R, 0, 1);
            hurtEnemy(e, dmg * f, { ignoreArmor: true });
            if (!e.boss && !e.dead) {

      /* --- Daño al jugador --- */

      /* ---------------------------------------------------------------------

      // Replica visualmente los ataques de cada jugador. El daño real sigue siendo

      function fireHarpoon() {
        const p = P, a = p.angle, c = Math.cos(a), s = Math.sin(a), m = 1 + 0.3 * has('harpoon');
        const shot = { type: 'harpoon', x: p.x + c * 24, y: p.y + s * 24, vx: c * 1500, vy: s * 1500, a, dmg: 60 * m, life: 1.1, hit: new Set(), carried: [], stuck: false, stuckT: 0, vib: 0 }; bullets.push(shot); mpSendAttackVisual('harpoon', shot);
        p.cdMax[0] = 0.62 * (1 - 0.15 * has('harpoon')); p.cd[0] = p.cdMax[0];
        p.vx -= c * 190; p.vy -= s * 190; p.kick = 0.12;

      }
      function stickHarpoon(b) {
        b.stuck = true; b.stuckT = 6; b.vib = 1; b.vx = b.vy = 0;
        spark(b.x, b.y, 12, '#ffd9a0', 330); shake(8); AudioSys.sfx('pin');
        const m = b.dmg / 60;
        for (const e of b.carried) {
          if (e.dead || e.impaled !== b) continue;
          e.impaled = null; e.pinned = b;
          moveEntity(e, 0, 0, e.r);
          hurtEnemy(e, 40 * m, { ignoreArmor: true });
          blood(e.x, e.y, 8, '#1fa89a', null, 220);
        }
      }
      function releaseHarpoon(b) {
        for (const e of b.carried) { if (e.impaled === b) e.impaled = null; if (e.pinned === b) e.pinned = null; }
      }
      function updateHarpoon(b, dt) {
        if (b.stuck) {
          b.stuckT -= dt; b.vib = Math.max(0, b.vib - dt * 3);
          if (b.stuckT <= 0) { releaseHarpoon(b); return false; }
          return true;
        }
        b.life -= dt;
        const steps = Math.max(1, Math.ceil(1500 * dt / 10)), sx = b.vx * dt / steps, sy = b.vy * dt / steps;
        for (let i = 0; i < steps; i++) {
          b.x += sx; b.y += sy;
          for (const e of enemies) {
            if (e.dead || e.spawnT > 0 || b.hit.has(e) || e.pull) continue;
            if (dist(b.x, b.y, e.x, e.y) < e.r + 5) {
              b.hit.add(e);
              hurtEnemy(e, b.dmg, { ang: b.a, armorMul: 0.6 });
              spark(b.x, b.y, 8, '#9fd0ff', 300); blood(b.x, b.y, 5, '#1fa89a', b.a, 220);
              if (!e.dead && !e.boss) { e.impaled = b; b.carried.push(e); }
            }
          }
          if (pointInSolid(b.x, b.y, 0)) { stickHarpoon(b); return true; }
        }
        let k = 0; const c = Math.cos(b.a), s = Math.sin(b.a);
        for (const e of b.carried) {
          if (e.dead || e.impaled !== b) continue;
          e.x = b.x - c * (e.r * 0.5 + k * 8); e.y = b.y - s * (e.r * 0.5 + k * 8); k++;
        }
        if (Math.random() < 0.5) bubbles(b.x, b.y, 1, 3);
        if (b.life <= 0) { releaseHarpoon(b); return false; }
        return true;
      }
      function fireTether() {
        let best = null, bd = 1e9;

        best.impaled = null; best.pinned = null; best.pull = true; best.pullT = 1.4;
        P.secMax[0] = 1.6; P.sec[0] = 1.6;

      function fireAcid() {

      function updateWeapons(dt) {
        const p = P, rm = reloadMult();
        p.cd[0] = Math.max(0, p.cd[0] - dt * rm); p.cd[1] = Math.max(0, p.cd[1] - dt);
        p.sec[0] = Math.max(0, p.sec[0] - dt * rm); p.sec[1] = Math.max(0, p.sec[1] - dt * rm);
        p.kick = Math.max(0, p.kick - dt);

        const sid = p.slots[p.weapon];

          if (mouse.l && p.cd[0] <= 0) fireHarpoon();

          if (mouse.l && !p.acidLock && p.ammo > 0) {

      function updatePlayer(dt) {
        const p = P;
        if (p.dead) { p.vx *= 0.9; p.vy *= 0.9; moveEntity(p, p.vx * dt, p.vy * dt, p.r); return; }
        if (p.rootT > 0) { p.rootT = Math.max(0, p.rootT - dt); p.vx *= 0.82; p.vy *= 0.82; moveEntity(p, p.vx * dt, p.vy * dt, p.r); return; }
        const rm = reloadMult(), sm = speedMult();
        if (MOBILE) {
          let target = null, targetD = 900;
          for (const e of enemies) {
            if (e.dead || e.spawnT > 0 || e.orbit > 0) continue;
            const d = dist(p.x, p.y, e.x, e.y);
            if (d < targetD) { target = e; targetD = d; }
          }
          if (target) {
            p.angle = Math.atan2(target.y - p.y, target.x - p.x);
            mouse.x = target.x; mouse.y = target.y; mouse.l = true;
          } else {
            mouse.l = false;
            p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
          }
        } else p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
        p.iframes = Math.max(0, p.iframes - dt); p.flash = Math.max(0, p.flash - dt);
        p.dashCd = Math.max(0, p.dashCd - dt * rm);
        p.pressure = Math.max(0, p.pressure - 24 * dt * (p.overheat ? 0.8 : 1));
        if (p.overheat && p.pressure < 30) { p.overheat = false; AudioSys.sfx('pickup'); }
        let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
        let iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
        const il = Math.hypot(ix, iy); if (il > 0) { ix /= il; iy /= il; }
        if (pressed.Space && p.dashCd <= 0 && !p.overheat && p.dashT <= 0) startDash(ix, iy);
        else if (pressed.Space && p.overheat) { floatText('PROPULSOR SOBRECARGADO', p.x, p.y - 30, '#ff5a5a', 13); AudioSys.sfx('ui'); }
        if (pressed.KeyE) detonateAll();
        if (p.dashT > 0) {
          p.dashT -= dt; p.vx = p.dx * 950; p.vy = p.dy * 950;
          addP({ kind: 'ghost', x: p.x, y: p.y, vx: 0, vy: 0, life: 0.25, size: p.r, color: '#7fe9ff' });
          if (Math.random() < 0.7) bubbles(p.x, p.y, 1, 8);
        } else {
          const spd = 250 * sm, acc = 3200 * dt;
          p.vx = approach(p.vx, ix * spd, acc); p.vy = approach(p.vy, iy * spd, acc);
        }
        moveEntity(p, p.vx * dt, p.vy * dt, p.r);
        updateWeapons(dt);
      }

      /* ---------------------------------------------------------------------
         9. DAÑO A ENEMIGOS Y MUERTE

      function hurtEnemy(e, dmg, o) {
        o = o || {};

      document.head.appendChild(mpStyle);

      const mpStatus = document.getElementById("mp-status");
      const mpNameInput = document.getElementById("mp-name");
      const MP_NAME_KEY = "abyssal-redo-player-name";
      function mpCleanName(value) {
        const clean = String(value || "").replace(/[<>\r\n]/g, "").trim().slice(0, 16);
        return clean || "Jugador";
      }
      let mpPlayerName = mpCleanName(localStorage.getItem(MP_NAME_KEY) || "Jugador");
      mpNameInput.value = mpPlayerName;
      mpNameInput.addEventListener("input", () => {

      });

      function mpMessage(message) {
        mpStatus.textContent = message;
      }

      function mpToggle(show) {
        mpOpen = show;
        mpUI.style.display = show ? "flex" : "none";
      }

      function mpResetSession(message = "DESCONECTADO") {
        MP.connected = false;
        MP.players = 0;
        MP.hostId = null;
        MP.isHost = false;
        MP.sharedLocked = false;
        MP.remotePlayers.clear();
        MP.reviveHolds.clear();

        MP.reviveLastSentTarget = null;

        document.getElementById("mp-ready-status").textContent = "ESPERANDO JUGADORES...";
        document.getElementById("mp-leave").style.display = "none";
        mpUpdateCount();
        mpMessage(message);
        state = "menu";
        mpToggle(true);
      }

      function mpLeaveRoom(message = "HAS ABANDONADO LA SALA") {
        const socket = MP.socket;
        if (socket && socket.readyState === WebSocket.OPEN) {
          try { socket.send(JSON.stringify({ type: "room-leave" })); } catch {}
        }
        MP.socket = null;
        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
          try { socket.close(1000, "leave"); } catch {}
        }
        mpResetSession(message);
      }

      function mpUpdateCount() {
        document.getElementById("mp-count").textContent = "JUGADORES: " + MP.players + "/4";
      }

      function mpUpdateLobby() {
        const status = document.getElementById("mp-ready-status");
        const button = document.getElementById("mp-ready");
        if (!status || !button) return;
        const readyCount = MP.readyIds.length;
        status.textContent = readyCount + "/" + MP.players + " LISTOS" +
          (MP.players < 2 ? " · ESPERANDO OTRO JUGADOR" : " · TODOS DEBEN ESTAR LISTOS");
        button.textContent = MP.ready ? "CANCELAR READY" : "ESTOY LISTO";
        button.disabled = MP.lobbyStarted || !MP.connected;
      }

      function mpConnect(code) {
        if (MP.socket) {
          MP.socket.close();
        }

        MP.connected = false;
        MP.players = 0;
        MP.hostId = null;
        MP.isHost = false;
        MP.sharedLocked = false;
        MP.ready = false; MP.readyIds = []; MP.lobbyStarted = false; MP.initialWorldSent = false;
        MP.lastUpgradeChoice = null;
        MP.lastAppliedUpgradeSeq = MP.upgradeSeq;
        MP.room = code;
        MP.remotePlayers.clear();
        MP.syncTimer = 0;

        document.getElementById("mp-room").textContent =
          "SALA: " + code;

        mpUpdateCount();
        mpMessage("CONECTANDO...");

        const wsURL =
          MP_SERVER.replace("https://", "wss://") +
          "/join/" + encodeURIComponent(code);

        const socket = new WebSocket(wsURL);
        MP.socket = socket;

        socket.onopen = () => {
          MP.connected = true;
          document.getElementById("mp-leave").style.display = "block";
          document.getElementById("mp-ready").style.display = "block";
          mpMessage("CONECTADO · SALA DE ESPERA");
        };

        socket.onmessage = event => {
          let data;

          try {
            data = JSON.parse(event.data);
          } catch {
            return;
          }

          if (data.type === 'lobby-state') {
            MP.players = Number(data.players) || 0;
            MP.hostId = data.hostId || MP.hostId;
            MP.isHost = MP.id === MP.hostId;
            MP.readyIds = Array.isArray(data.readyIds) ? data.readyIds : [];
            MP.ready = MP.readyIds.includes(MP.id);
            mpUpdateCount();
            mpUpdateLobby();
            return;
          }

          if (data.type === 'lobby-start') {
            if (MP.lobbyStarted) return;
            MP.lobbyStarted = true;
            MP.ready = true;
            mpUpdateLobby();
            mpMessage("TODOS LISTOS · INICIANDO INMERSIÓN");
            mpToggle(false);
            charMenu = false; pendingStart = null;
            infinite = false;
            MP.lastSessionKey = null;
            MP.initialWorldSent = false;
            mpWorldTimer = 0;
            newRun();
            return;
          }

          if (data.type === 'boss-light-interact' && MP.isHost && data.roomKey === mpRoomKey()) {
            const boss=enemies.find(q=>q.boss && q.netId===data.bossId && q.state==='desp_lights' && Array.isArray(q.despLights));
            const remote=MP.remotePlayers.get(data.id), index=Number(data.lightIndex);
            if (boss && remote && Number.isInteger(index) && index>=0 && index<boss.despLights.length && dist(remote.x,remote.y,boss.despLights[index].x,boss.despLights[index].y)<75) {
              const correct=boss.despLights.reduce((a,b)=>b.power>a.power?b:a,boss.despLights[0]);
              if (boss.despLights[index]===correct) { finishBossDesperationRound(boss); }
              else hurtEnemyTargetPlayer(remote,12,Math.atan2(remote.y-boss.y,remote.x-boss.x));
            }
            return;
          }
          if (data.type === 'player-state' && data.id !== MP.id) {
            const x = Number(data.x);
            const y = Number(data.y);
            const angle = Number(data.angle);

            if (![x, y, angle].every(Number.isFinite)) return;

            let remote = MP.remotePlayers.get(data.id);

            if (!remote) {
              remote = {
                id: data.id,
                x, y,
                tx: x,
                ty: y,
                angle,
                ta: angle,
                r: 16,
                weapon: 0,
                name: mpCleanName(data.name || "Jugador"),
                isHost: data.id === MP.hostId,
                kick: 0,
                dashT: 0,
                iframes: 0,
                flash: 0,
                cd: [0, 0],
                shield: 0,
                lastSeen: performance.now()
              };

              MP.remotePlayers.set(data.id, remote);
            }

            remote.id = data.id;
            remote.tx = x;
            remote.ty = y;
            remote.ta = angle;
            remote.name = mpCleanName(data.name || remote.name || "Jugador");
            remote.isHost = data.id === MP.hostId;
            remote.r = Number(data.r) || 16;
            remote.weapon = data.weapon === 1 ? 1 : 0;
            remote.kick = Number(data.kick) || 0;
            remote.dashT = Number(data.dashT) || 0;
            remote.iframes = Number(data.iframes) || 0;
            remote.flash = Number(data.flash) || 0;
            remote.cd = [Number(data.cd0) || 0, 0];
            remote.shield = Number(data.shield) || 0;
            remote.hp = Number(data.hp) || 0;
            remote.maxHp = Number(data.maxHp) || 1;
            remote.dead = !!data.dead;
            remote.spectating = !!data.spectating;
            remote.deadAt = Number(data.deadAt) || 0;
            remote.roomKey = data.roomKey || null;
            remote.lastSeen = performance.now();

            return;
          }

          if (data.type === 'player-attack' && data.ownerId !== MP.id) {
            if (data.roomKey && data.roomKey !== mpRoomKey()) return;
            const a = data.attack || {};
            if (!['harpoon', 'acid', 'flare', 'anchor', 'medusa', 'mine', 'saw', 'special'].includes(a.kind)) return;
            if (![a.x, a.y, a.vx, a.vy].every(v => Number.isFinite(Number(v)))) return;
            MP.remoteBullets.push({
              kind: a.kind,
              x: Number(a.x), y: Number(a.y),
              vx: Number(a.vx), vy: Number(a.vy),
              a: Number(a.a) || 0,
              life: clamp(Number(a.life) || 0.3, 0.05, 2),
              r: clamp(Number(a.r) || 6, 2, 24),
              ownerId: data.ownerId
            });
            if (MP.remoteBullets.length > 80) MP.remoteBullets.splice(0, MP.remoteBullets.length - 80);
            return;
          }

          if (data.type === 'revive-hold' && data.targetId === MP.id && data.helperId !== MP.id) {
            // No exigir roomKey aquí: las coordenadas sincronizadas y la distancia
            // validan que el compañero esté realmente junto al jugador caído.
            MP.reviveHolds.set(data.helperId, { holding: !!data.holding, at: performance.now() });
            return;
          }
          if (data.type === 'revive-done' && data.targetId !== MP.id) {
            const revived = MP.remotePlayers.get(data.targetId);
            if (revived) { revived.dead = false; revived.hp = Number(data.hp) || revived.maxHp * 0.5; revived.reviveProgress = 0; }
            return;
          }
          if (data.type === 'revive-progress' && data.helperId === MP.id) {
            if (data.roomKey && data.roomKey !== mpRoomKey()) return;
            MP.reviveHelpingProgress = clamp(Number(data.progress) || 0, 0, 1);
            MP.reviveHelpingTarget = data.targetId || null;
            return;
          }
          if (data.type === 'player-fx' && data.action === 'damage' && data.targetId === MP.id) {
            if (data.roomKey && data.roomKey !== mpRoomKey()) return;
            const damage = Math.min(10000, Math.max(0, Number(data.damage) || 0));
            const angle = Number(data.angle) || 0;
            if (damage > 0) hurtPlayer(damage, angle);
            if (Number.isFinite(data.pushX)) P.vx += clamp(Number(data.pushX), -1200, 1200);
            if (Number.isFinite(data.pushY)) P.vy += clamp(Number(data.pushY), -1200, 1200);
            return;
          }
          if (data.type === "world-state" && !MP.isHost) {
            if (!MP.lobbyStarted) return;
            mpApplyWorld(data);
            return;
          }
          if (data.type === 'enemy-status' && MP.isHost) {
            if (state !== 'playing' || (data.roomKey && data.roomKey !== mpRoomKey())) return;
            const sender = MP.remotePlayers.get(data.playerId);
            const enemy = enemies.find(e => e.netId === data.netId && !e.dead);
            if (!sender || sender.dead || sender.roomKey !== mpRoomKey() ||
                performance.now() - sender.lastSeen > 1500 || !enemy) return;
            const duration = clamp(Number(data.duration) || 0, 0, 12);
            if (data.status === 'bounty') enemy.bounty = true;
            else if (data.status === 'mark') enemy.marked = Math.max(enemy.marked || 0, duration);
            else if (data.status === 'stun') {
              enemy.stun = Math.max(enemy.stun || 0, duration);
              enemy.slow = Math.max(enemy.slow || 0, clamp(Number(data.slow) || 0, 0, 12));
            } else if (data.status === 'toxin') {
              enemy.corrode = Math.min(8, (enemy.corrode || 0) + clamp(Number(data.stacks) || 1, 1, 8));
              enemy.corrodeT = Math.max(enemy.corrodeT || 0, duration);
              enemy.burn = Math.max(enemy.burn || 0, clamp(Number(data.burn) || 0, 0, 8));
            } else if (data.status === 'vuln' && enemy.boss) {
              enemy.vuln = Math.max(enemy.vuln || 0, duration);
              enemy.slow = Math.max(enemy.slow || 0, clamp(Number(data.slow) || 0, 0, 12));
            } else if (data.status === 'knockback') {
              enemy.vx += clamp(Number(data.pushX) || 0, -1200, 1200);
              enemy.vy += clamp(Number(data.pushY) || 0, -1200, 1200);
            }
            return;
          }
          if (data.type === 'enemy-hit' && MP.isHost) {
            if (state !== 'playing') return;
            const attacker = MP.remotePlayers.get(data.playerId);
            if (!attacker || attacker.dead || attacker.roomKey !== mpRoomKey() || performance.now() - attacker.lastSeen > 1500) return;
            const target = enemies.find(e => e.netId === data.netId && !e.dead);
            if (target && Number.isFinite(Number(data.damage))) {
              const dealt = hurtEnemy(target, Math.min(100000, Math.max(0, Number(data.damage))), {
                ...(data.options || {}), fromMP: true, attackerId: data.playerId,
                mpLifesteal: Number(data.options && data.options.mpLifesteal) || 0
              });
              if (dealt > 0) {
                const attackerHeal = dealt * clamp(Number(data.options && data.options.mpLifesteal) || 0, 0, 1) +
                  (target.dead ? 3 * (clamp(Number(data.options && data.options.mpLeech) || 0, 0, 10) + 2 * clamp(Number(data.options && data.options.mpVamp) || 0, 0, 10)) : 0);
                try { MP.socket.send(JSON.stringify({
                  type: 'enemy-damage', netId: target.netId, damage: dealt,
                  hp: Math.max(0, target.hp), dead: !!target.dead,
                  x: target.x, y: target.y, attackerId: data.playerId || data.attackerId || null,
                  heal: attackerHeal, roomKey: mpRoomKey()
                })); } catch {}
              }
            }
            return;
          }
          if (data.type === 'enemy-damage' && !MP.isHost) {
            if (data.roomKey && data.roomKey !== mpRoomKey()) return;
            if (data.attackerId === MP.id && Number(data.heal) > 0 && !P.dead) {
              const healed = Math.min(P.maxHp - P.hp, Number(data.heal));
              if (healed > 0) { P.hp += healed; floatText('+' + Math.round(healed), P.x, P.y - 28, '#c46bff', 13); spark(P.x, P.y, 4, '#c46bff', 170); }
            }
            const target = enemies.find(e => e.netId === data.netId);
            if (target) {
              const hitX = Number.isFinite(Number(data.x)) ? Number(data.x) : target.x;
              const hitY = Number.isFinite(Number(data.y)) ? Number(data.y) : target.y;
              const dealt = Math.max(0, Number(data.damage) || 0);
              target.hp = Math.max(0, Number(data.hp) || 0);
              target.flash = 0.22;
              target.hitT = 0.22;
              if (dealt > 0) {
                const col = (ET[target.type] && ET[target.type].color) || '#d8f7ff';

                spark(hitX, hitY, 9, col, 300);
                blood(hitX, hitY, target.type === 'tank' ? 7 : 4, target.type === 'tank' ? '#8a7a20' : '#1fa89a', null, 220);
                ring(hitX, hitY, Math.max(12, target.r * 1.5), col, 0.28, 2.5);
                addGlow(hitX, hitY, target.r * 2.2, col, 0.65);
                shake(target.type === 'tank' ? 3 : 1.5);
                AudioSys.sfx('hit');
              }
              if (data.dead && !target.dead) {
                target.dead = true;
                const col = (ET[target.type] && ET[target.type].color) || '#ff4fd8';
                blood(hitX, hitY, target.type === 'tank' ? 18 : 10, target.type === 'tank' ? '#8a7a20' : '#1fa89a', null, 300);

                bubbles(hitX, hitY, 8, target.r);

              }

            return;
          }
          if (data.type === 'pickup-request' && MP.isHost) {
            const player = MP.remotePlayers.get(data.playerId);
            const item = pickups.find(p => p.mpId === data.pickupId && !p.got);
            const valid = state === 'playing' && player && !player.dead && player.roomKey === mpRoomKey() &&
              performance.now() - player.lastSeen < 1000 && item && dist(player.x, player.y, item.x, item.y) < 55 &&
              (!data.roomKey || data.roomKey === mpRoomKey());
            if (valid) item.got = true;
            try { MP.socket.send(JSON.stringify({ type: 'pickup-result', playerId: data.playerId, pickupId: data.pickupId, accepted: !!valid, heal: valid ? Number(item.heal) || 0 : 0, roomKey: mpRoomKey() })); } catch {}
            return;
          }
          if (data.type === 'plant-heal-request' && MP.isHost) {
            const player = MP.remotePlayers.get(data.playerId);
            const feature = feats.find(f => f.mpId === data.featureId && f.k === 'plant' && !f.used);
            const valid = state === 'playing' && player && !player.dead && player.roomKey === mpRoomKey() &&
              performance.now() - player.lastSeen < 1000 && feature && dist(player.x, player.y, feature.x, feature.y) < 65 &&
              (!data.roomKey || data.roomKey === mpRoomKey());
            if (valid) feature.used = true;
            try { MP.socket.send(JSON.stringify({ type: 'plant-heal-result', playerId: data.playerId, featureId: data.featureId, accepted: !!valid, heal: valid ? (Number(player.maxHp) || 100) * 0.15 : 0, roomKey: mpRoomKey() })); } catch {}
            return;
          }
          if (data.type === 'secret-heal-request' && MP.isHost) {
            const player = MP.remotePlayers.get(data.playerId);
            const valid = state === 'playing' && player && !player.dead && player.roomKey === mpRoomKey() &&
              performance.now() - player.lastSeen < 1000 && secret && !secret.found &&
              dist(player.x, player.y, secret.x, secret.y) < 48 &&
              (!data.roomKey || data.roomKey === mpRoomKey());
            if (valid) secret.found = true;
            try { MP.socket.send(JSON.stringify({ type: 'secret-heal-result', playerId: data.playerId, accepted: !!valid, heal: valid ? 30 : 0, roomKey: mpRoomKey() })); } catch {}
            return;
          }
          if (data.type === 'pickup-result' && data.playerId === MP.id) {
            if (data.roomKey && data.roomKey !== mpRoomKey()) return;
            MP.pendingPickupIds.delete(data.pickupId);
            if (data.accepted && Number(data.heal) > 0 && !P.dead) {
              P.hp = Math.min(P.maxHp, P.hp + Number(data.heal));
              floatText('+' + Number(data.heal), P.x, P.y - 28, '#7dff6a', 15);
              spark(P.x, P.y, 6, '#7dff6a', 200); AudioSys.sfx('pickup');
            }
            return;
          }
          if (data.type === 'plant-heal-result' && data.playerId === MP.id) {
            if (data.roomKey && data.roomKey !== mpRoomKey()) return;
            MP.pendingFeatureIds.delete(data.featureId);
            if (data.accepted && Number(data.heal) > 0 && !P.dead) {
              P.hp = Math.min(P.maxHp, P.hp + Number(data.heal));
              floatText('+VIDA', P.x, P.y - 30, '#7dff6a', 14); AudioSys.sfx('coin');
            }
            return;
          }
          if (data.type === 'secret-heal-result' && data.playerId === MP.id) {
            if (data.roomKey && data.roomKey !== mpRoomKey()) return;
            MP.pendingSecretHeal = false;
            if (data.accepted && Number(data.heal) > 0 && !P.dead) {
              P.hp = Math.min(P.maxHp, P.hp + Number(data.heal));
              floatText('CACHÉ SECRETA +30 VIDA', P.x, P.y - 20, '#2ee6ff', 16);
              boomFx(P.x, P.y, 60, '#2ee6ff'); AudioSys.sfx('upgrade');
            }
            return;
          }
          if (data.type === 'shop-buy-request' && MP.isHost) {
            const player = MP.remotePlayers.get(data.playerId);
            const item = shopItems.find(q => q.c && q.c.id === data.itemId && !q.sold);
            const valid = state === 'playing' && rs === 'shop' && player && !player.dead &&
              player.roomKey === mpRoomKey() && performance.now() - player.lastSeen < 1000 &&
              item && dist(player.x, player.y, item.x, item.y) < 95 &&
              (!data.roomKey || data.roomKey === mpRoomKey()) && organs >= item.price;
            if (valid) { organs -= item.price; item.sold = true; }
            try { MP.socket.send(JSON.stringify({ type: 'shop-buy-result', playerId: data.playerId, itemId: data.itemId, accepted: !!valid, organs, roomKey: mpRoomKey() })); } catch {}
            return;
          }
          if (data.type === 'shop-buy-result' && data.playerId === MP.id) {
            if (data.roomKey && data.roomKey !== mpRoomKey()) return;
            MP.pendingShopItem = null;
            if (data.accepted) {
              const item = shopItems.find(q => q.c && q.c.id === data.itemId);
              if (item) { item.sold = true; applyShopPurchase(item); }
            } else floatText('COMPRA NO DISPONIBLE', P.x, P.y - 30, '#ff5a5a', 13);
            return;
          }
          if (data.type === 'xp-request' && MP.isHost) {
            if (state !== 'playing') return;
            const amount = Math.min(10000, Math.max(0, Number(data.amount) || 0));
            const guestXp = clamp(Number(data.xpStat) || 1, 0.1, 10);
            if (amount > 0) addXP(amount * guestXp / Math.max(0.1, P.st.xp));
            return;
          }

          if (data.type === "host-left") {
            mpResetSession("EL ANFITRIÓN ABANDONÓ · PARTIDA TERMINADA");
            return;
          }

          if (data.type === "welcome") {
            if (data.id) MP.id = data.id;
            MP.hostId = data.hostId || null;
            MP.isHost = !!data.isHost || MP.id === MP.hostId;
            MP.players = Number(data.players) || 1;
            mpUpdateCount();
            mpMessage(MP.isHost ? "SALA CREADA · ERES ANFITRIÓN" : "CONECTADO A LA SALA");
          }

          if (data.type === "player-joined") {
            MP.hostId = data.hostId || MP.hostId;
            MP.isHost = MP.id === MP.hostId;
            MP.players = Number.isFinite(Number(data.players))
              ? Number(data.players)
              : Math.min(4, MP.players + 1);
            mpUpdateCount();
          }

          if (data.type === "player-left") {
            MP.hostId = data.hostId || null;
            MP.isHost = MP.id === MP.hostId;
            MP.players = Number.isFinite(Number(data.players))
              ? Number(data.players)
              : Math.max(0, MP.players - 1);
            mpUpdateCount();
          }

          if (data.type === "host-changed") {
            MP.hostId = data.hostId || null;
            MP.isHost = MP.id === MP.hostId;
            mpMessage(MP.isHost ? "AHORA ERES EL ANFITRIÓN" : "ANFITRIÓN ACTUALIZADO");
          }
        };

        socket.onerror = () => {
          mpMessage("ERROR DE CONEXIÓN");
        };

        socket.onclose = event => {
          if (MP.socket !== socket) return;
          MP.socket = null;

          if (event.code === 4001 || event.reason === "host-left") {
            mpResetSession("EL ANFITRIÓN ABANDONÓ · PARTIDA TERMINADA");
            return;
          }

          MP.connected = false;
          MP.players = 0;
          MP.hostId = null;
          MP.isHost = false;
          MP.remotePlayers.clear();
          mpUpdateCount();
          mpMessage("DESCONECTADO");
        };
      }

      // ==========================================
      // SINCRONIZACIÓN MULTIJUGADOR
      // ==========================================

      const MP_WORLD_FIELDS = [
        'type','x','y','vx','vy','r','hp','maxHp','speed','face','spawnT','spawnMax',
        'flash','slow','burn','blind','marked','stun','corrode','corrodeT','hitCd',
        't','state','st','cd','side','sideT','pull','pullT','dead','boss','mini',
        'score','wanderT','wA','hitDone','cA','n','af','orbit','orbitT','phase',
        'shield','vuln','vulnT','parryT','dodgeT','dodgeA','reflect','ecd',
        'vis','cam','amT','amInit','segT','bounty','phaseInvuln','despLock','despFinished','despStage','despTimer','despCycles','escape','despY','despDir','rollA','rollN','despLights','damageMult'
      ];
      let mpWorldTimer = 0;
      let mpWorldRevision = 0;

      function mpRoomKey() { return `${floorN}:${cell ? cell.x + ',' + cell.y : 'none'}`; }
      function mpClone(value) { try { return JSON.parse(JSON.stringify(value)); } catch { return null; } }
      function mpNearDownedTeammate() {
        if (!MP || !MP.connected || !P || P.dead) return false;
        for (const remote of MP.remotePlayers.values()) {
          if (!remote.dead || performance.now() - remote.lastSeen > 1500) continue;
          if (dist(P.x, P.y, remote.x, remote.y) <= 125) return true;
        }
        return false;
      }

      function mpSendReviveHold(targetId, holding) {
        if (!MP.socket || MP.socket.readyState !== WebSocket.OPEN) return;
        try {
          MP.socket.send(JSON.stringify({
            type: 'revive-hold', targetId, helperId: MP.id,
            holding: !!holding, roomKey: mpRoomKey()
          }));
        } catch {}
      }

      function mpUpdateRevives(dt) {
        if (!MP.connected || state !== 'playing' || !MP.socket ||
            MP.socket.readyState !== WebSocket.OPEN) return;

        // Jugador vivo: mantener F cerca de un compañero caído.
        if (!P.dead) {
          let nearest = null, nearestD = 105;
          for (const remote of MP.remotePlayers.values()) {
            if (!remote.dead || performance.now() - remote.lastSeen > 1500) continue;
            const rx = Number.isFinite(remote.x) ? remote.x : remote.tx;
            const ry = Number.isFinite(remote.y) ? remote.y : remote.ty;
            const d = dist(P.x, P.y, rx, ry);
            if (d < nearestD) { nearest = remote; nearestD = d; }
          }
          const targetId = keys.KeyF && nearest ? nearest.id : null;
          MP.reviveSendTimer -= dt;
          if (MP.reviveSendTimer <= 0 || targetId !== MP.reviveLastSentTarget) {
            MP.reviveSendTimer = 0.1;
            if (targetId || MP.reviveLastSentTarget) {
              mpSendReviveHold(targetId || MP.reviveLastSentTarget, !!targetId);
            }
            MP.reviveLastSentTarget = targetId;
          }
          MP.reviveProgressTarget = targetId;
        }

        // El cliente caído calcula el progreso y lo comparte con quien lo revive.
        // Así ambos ven la misma barra en tiempo real.
        if (P.dead) {
          let helper = null;
          for (const [id, hold] of MP.reviveHolds) {
            const remote = MP.remotePlayers.get(id);
            if (!hold.holding || performance.now() - hold.at > 1000 ||
                !remote || remote.dead ||
                performance.now() - remote.lastSeen > 1500 ||
                dist(P.x, P.y, remote.x, remote.y) > 130) continue;
            helper = remote;
            break;
          }
          if (helper && Date.now() - (P.deadAt || Date.now()) < 30000) {
            MP.reviveProgress = Math.min(10, MP.reviveProgress + dt);
            MP.reviveProgressTarget = helper.id;
          } else {
            MP.reviveProgress = 0;
            MP.reviveProgressTarget = null;
          }
          MP.reviveProgressSendTimer = (MP.reviveProgressSendTimer || 0) - dt;
          if (helper && MP.reviveProgressSendTimer <= 0) {
            MP.reviveProgressSendTimer = 0.1;
            MP.reviveProgressLastHelper = helper.id;
            try {
              MP.socket.send(JSON.stringify({
                type: 'revive-progress', helperId: helper.id,
                targetId: MP.id, progress: MP.reviveProgress / 10,
                roomKey: mpRoomKey()
              }));
            } catch {}
          } else if (!helper && MP.reviveProgressLastHelper) {
            const previousHelper = MP.reviveProgressLastHelper;
            MP.reviveProgressLastHelper = null;
            MP.reviveProgressSendTimer = 0;
            try {
              MP.socket.send(JSON.stringify({
                type: 'revive-progress', helperId: previousHelper,
                targetId: MP.id, progress: 0, roomKey: mpRoomKey()
              }));
            } catch {}
          }
          if (MP.reviveProgress >= 10) {
            P.dead = false;
            P.deadT = 0;
            P.deadAt = 0;
            P.hp = Math.max(1, Math.round(P.maxHp * 0.5));
            P.iframes = 2;
            MP.reviveProgress = 0;
            MP.reviveHolds.clear();
            MP.reviveProgressSendTimer = 0;
            try {
              MP.socket.send(JSON.stringify({
                type: 'revive-done', targetId: MP.id, hp: P.hp,
                roomKey: mpRoomKey()
              }));
            } catch {}
            boomFx(P.x, P.y, 90, '#7dff6a', '#2ee6ff');
            ring(P.x, P.y, 150, '#7dff6a', 0.8, 5);
            floatText('¡REVIVIDO!', P.x, P.y - 42, '#7dff6a', 25);
            AudioSys.sfx('upgrade');
          }
        }
      }

      function mpApplyUpgradeChoice(choice) {
        if (!choice || !P || !choice.id) return;
        if (choice.statKey && Number.isFinite(choice.statValue)) {
          P.st[choice.statKey] = choice.statValue;
        } else {
          const base = UPS.find(u => u.id === choice.id);
          if (base) {
            P.up[choice.id] = (P.up[choice.id] || 0) + 1;
            if (base.apply) base.apply();
          }
        }
        if (choice.statKey) P.up[choice.id] = (P.up[choice.id] || 0) + 1;
        P.hist.push({ id: choice.id, name: choice.name || choice.id, col: choice.col || '#8fb8d8', stat: STATS.find(q => q.id === choice.id) || null, rar: choice.rar || 0 });
        P.hp = Math.min(P.maxHp, P.hp + Math.round(P.maxHp * (0.1 + P.st.heal)));
        AudioSys.sfx('upgrade');
      }

      function mpApplyWorld(data) {
        let roomChanged = false;
        if (data.room) {
          const r = data.room;
          if (r.key && r.key !== MP.lastSessionKey) {
            roomChanged = true;
            floorN = Number(r.floorN) || floorN; roomN = Number(r.roomN) || roomN;
            if (r.dun && r.dun.cells) dun = mpClone(r.dun);
            if (dun && dun.cells && r.cellKey) cell = dun.cells[r.cellKey] || cell;
            if (cell) startRoom();
            MP.lastSessionKey = r.key;
          }
          if (r.dun && r.dun.cells) dun = mpClone(r.dun);
          if (dun && dun.cells && r.cellKey) cell = dun.cells[r.cellKey] || cell;
          floorN = Number(r.floorN) || floorN; roomN = Number(r.roomN) || roomN;
          const previousRoomState = rs;
          rs = r.rs || rs; introT = Number(r.introT) || 0; doorOpen = Number(r.doorOpen) || 0;
          if (!MP.isHost && r.rs === 'cleared' && previousRoomState !== 'cleared' && P && !P.dead) {
            const heal = Math.round(P.maxHp * (0.1 + P.st.heal));
            const actual = Math.min(P.maxHp - P.hp, heal);
            if (actual > 0) { P.hp += actual; floatText('+' + actual, P.x, P.y - 28, '#7dff6a', 13); }
          }
          waveQueue = mpClone(r.waveQueue) || waveQueue;
          if (r.obstacles) obstacles = mpClone(r.obstacles);
          if (r.lights) lights = mpClone(r.lights);
          if (r.feats) feats = mpClone(r.feats);
          if (Array.isArray(r.shopItems)) shopItems = mpClone(r.shopItems);
          if (r.secret !== undefined) secret = mpClone(r.secret);
          if (r.chest !== undefined) chest = mpClone(r.chest);
          if (r.exitPortal !== undefined) exitPortal = mpClone(r.exitPortal);
          if (r.sidePortal !== undefined) sidePortal = mpClone(r.sidePortal);
          if (roomChanged && typeof bakeBG === 'function') bakeBG();
        }
        if (Array.isArray(data.enemies)) {
          const previous = new Map(enemies.map(e => [e.netId, e]));
          enemies = data.enemies
            .filter(e => e && typeof e.netId === 'string' && Number.isFinite(e.x) && Number.isFinite(e.y) && Number.isFinite(e.hp))
            .map(incoming => {
              const old = previous.get(incoming.netId);
              if (!old) return { ...incoming, _mpTx: incoming.x, _mpTy: incoming.y, pinned: null, impaled: null };
              const currentX = old.x, currentY = old.y;
              Object.assign(old, incoming, { _mpTx: incoming.x, _mpTy: incoming.y });
              old.x = currentX; old.y = currentY;
              old.pinned = null; old.impaled = null;
              return old;
            });
        }
        if (Array.isArray(data.ebullets)) ebullets = mpClone(data.ebullets) || [];
        if (Array.isArray(data.pickups)) {
          const previousPickups = new Map(pickups.map(p => [p.mpId, p]));
          pickups = data.pickups.filter(incoming => !incoming.got).map(incoming => {
            const old = previousPickups.get(incoming.mpId);
            if (!old) return incoming;
            Object.assign(old, incoming);
            return old;
          });
          for (const id of [...MP.pendingPickupIds]) if (!pickups.some(p => p.mpId === id)) MP.pendingPickupIds.delete(id);
        }
        if (Array.isArray(data.orbs)) orbs = mpClone(data.orbs) || [];
        if (Number.isFinite(data.xp)) xp = data.xp;
        const previousSyncedLevel = level;
        if (Number.isFinite(data.level)) level = data.level;
        if (!MP.isHost && P && previousSyncedLevel < 5 && level >= 5 && !P.path && !MP.localClassDone) {
          MP.localClassOpen = true;
          state = 'class';
          AudioSys.sfx('upgrade');
        }
        if (!MP.isHost && P && P.path) {
          for (const milestone of [10, 20]) {
            if (previousSyncedLevel < milestone && level >= milestone && !MP.localClassMilestones.has(milestone)) {
              MP.localClassMilestones.add(milestone);
              MP.localClassOpen = true; MP.localClassDone = false; P.tier = milestone === 10 ? 2 : 3;
              banner = { t: 2.8, max: 2.8, l1: 'REBRANCH · NIVEL ' + milestone, l2: 'Elige una nueva rama de clase' };
              AudioSys.sfx('upgrade');
            }
          }
        }
        if (Number.isFinite(data.xpNeed)) xpNeed = data.xpNeed;
        if (Number.isFinite(data.organs)) organs = data.organs;
        if (Number.isFinite(data.pend)) pend = data.pend;
        if (Number.isFinite(data.cpend)) cpend = data.cpend;
        if (Number.isFinite(data.kills)) kills = data.kills;

        // Cada cliente tiene sus propias cartas y su propia elección.
        // El estado del anfitrión solo anuncia el inicio del nivel de mejora.
        if (typeof data.gameState === 'string' && ['playing', 'paused', 'upgrade', 'shop', 'class', 'lock', 'dive', 'gameover', 'victory'].includes(data.gameState)) {
          const incomingState = data.gameState;

          if (!MP.isHost && state === 'inv' && (incomingState === 'playing' || incomingState === 'class')) {
            if (incomingState === 'class') MP.pendingClassMenu = true;
            state = 'inv';
          } else if (!MP.isHost && incomingState === 'class') {
            MP.localClassOpen = true; state = MP.localClassDone ? 'playing' : 'class';
          } else if (!MP.isHost && incomingState === 'playing' && MP.localClassOpen && !MP.localClassDone) {
            state = 'class';
          } else if (!MP.isHost && incomingState === 'playing' && MP.localClassDone) {
            state = 'playing'; MP.localClassDone = false; MP.localClassOpen = false;
          } else if (!MP.isHost && incomingState === 'upgrade') {
            if (!MP.localUpgradeOpen || (!MP.localUpgradeDone && (!Array.isArray(cards) || cards.length !== 3))) {
              MP.localUpgradeOpen = true;
              MP.localUpgradeDone = false;
              cards = [];
              openUpgrades();
            }
            // El invitado mantiene su selección abierta aunque el anfitrión
            // ya haya elegido; así nadie pierde sus cartas ni su elección.
            if (!MP.localUpgradeDone) state = 'upgrade';
            else state = 'upgrade';
          } else if (!MP.isHost && incomingState === 'playing' && MP.localUpgradeOpen && !MP.localUpgradeDone) {
            // El anfitrión ya terminó, pero este invitado aún debe elegir.
            state = 'upgrade';
            if (!Array.isArray(cards) || cards.length !== 3) openUpgrades();
          } else {
            state = incomingState;
            if (incomingState !== 'upgrade') {
              if (!MP.isHost) {
                MP.localUpgradeOpen = false;
                MP.localUpgradeDone = false;
              }
              cards = [];
            }
          }

          MP.sharedLocked = incomingState === 'paused' || incomingState === 'upgrade' || incomingState === 'shop' || incomingState === 'class' || incomingState === 'lock';
        }
        // Solo el anfitrión utiliza sus propias cartas; nunca se copian al invitado.
        mpWorldRevision = Number(data.revision) || mpWorldRevision;
      }

      function mpSendWorld(dt) {
        if (!MP.connected || !MP.isHost || !MP.socket ||
            MP.socket.readyState !== WebSocket.OPEN) return;
        mpWorldTimer += dt;
        if (mpWorldTimer < 0.05) return;
        mpWorldTimer = 0;

        for (const p of pickups) if (!p.mpId) p.mpId = crypto.randomUUID();
        for (const f of feats) if (!f.mpId) f.mpId = crypto.randomUUID();

        const snapshot = enemies.map(e => {
          const out = { netId: e.netId || (e.netId = crypto.randomUUID()) };
          for (const key of MP_WORLD_FIELDS) { const value = e[key]; if (value === null || ['string','number','boolean'].includes(typeof value)) out[key] = value; }
          for (const key of ['tl','tt','zp','zl','seg','despLights']) if (Array.isArray(e[key])) out[key] = mpClone(e[key]);
          return out;
        });
        const room = { key: mpRoomKey(), floorN, roomN, cellKey: cell ? cell.x + ',' + cell.y : null, dun: mpClone(dun), rs, introT, doorOpen, waveQueue: mpClone(waveQueue), obstacles: mpClone(obstacles), lights: mpClone(lights), feats: mpClone(feats), shopItems: mpClone(shopItems), secret: mpClone(secret), chest: mpClone(chest), exitPortal: mpClone(exitPortal), sidePortal: mpClone(sidePortal) };
        try {
          const upgradeCards = state === 'upgrade' ? cards.map(c => ({ id: c.id, name: c.name, desc: c.desc, col: c.col, icon: c.icon, art: c.art, rar: c.rar || 0, max: c.max || 99, statKey: c.statKey || null, statValue: Number.isFinite(c.statValue) ? c.statValue : null })) : null;
          const revision = ++mpWorldRevision;
          const includeRoom = !MP.initialWorldSent || revision % 2 === 0;
          if (includeRoom) MP.initialWorldSent = true;
          MP.socket.send(JSON.stringify({ type: 'world-state', revision, gameState: state, upgradeCards, room: includeRoom ? room : undefined, enemies: snapshot, ebullets: mpClone(ebullets), pickups: mpClone(pickups), orbs: mpClone(orbs), xp, level, xpNeed, organs, pend, cpend, kills }));
        } catch (error) {
          console.warn('[MP] Error sincronizando enemigos:', error);
        }
      }

      window.mpSyncUpdate = function(dt) {
        if (
          state === 'playing' &&
          P &&
          MP.connected &&
          MP.socket &&
          MP.socket.readyState === WebSocket.OPEN
        ) {
          MP.syncTimer += dt;

          if (MP.syncTimer >= 0.05) {
            MP.syncTimer = 0;

            try {
              MP.socket.send(JSON.stringify({
                type: 'player-state',
                id: MP.id,
                name: mpPlayerName,
                x: P.x,
                y: P.y,
                angle: P.angle,
                r: P.r,
                weapon: P.weapon,
                kick: P.kick,
                dashT: P.dashT,
                iframes: P.iframes,
                flash: P.flash,
                cd0: P.cd[0],
                shield: P.shield,
                hp: P.hp,
                maxHp: P.maxHp,
                dead: P.dead,
                spectating: !!P.spectating,
                deadAt: P.dead ? (P.deadAt || Date.now()) : 0,
                roomKey: mpRoomKey()
              }));
            } catch (error) {
              console.warn("[MP] Error enviando posición:", error);
            }
          }
        }

        mpSendWorld(dt);

        // Los proyectiles de compañeros son únicamente visuales: nunca colisionan
        // ni aplican daño local, para evitar duplicar el cálculo autoritativo.
        for (let i = MP.remoteBullets.length - 1; i >= 0; i--) {
          const b = MP.remoteBullets[i];
          b.life -= dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          if (b.life <= 0) MP.remoteBullets.splice(i, 1);
        }

        // Suaviza las posiciones de los enemigos recibidas del anfitrión.
        if (!MP.isHost) {
          const enemyK = Math.min(1, dt * 22);
          for (const enemy of enemies) {
            if (!Number.isFinite(enemy._mpTx) || !Number.isFinite(enemy._mpTy)) continue;
            enemy.x += (enemy._mpTx - enemy.x) * enemyK;
            enemy.y += (enemy._mpTy - enemy.y) * enemyK;
          }
        }

        if (!MP.remotePlayers) return;

        const now = performance.now();

        for (const [id, remote] of MP.remotePlayers) {
          if (now - remote.lastSeen > 15000) {
            MP.remotePlayers.delete(id);
            continue;
          }

          const k = Math.min(1, dt * 24);

          remote.x += (remote.tx - remote.x) * k;
          remote.y += (remote.ty - remote.y) * k;

          if (typeof angDiff === "function") {
            remote.angle += angDiff(remote.ta, remote.angle) * k;
          } else {
            remote.angle += (remote.ta - remote.angle) * k;
          }
        }
      };

      // Crear sala
      document.getElementById("mp-create").onclick = async () => {
        try {
          mpMessage("CREANDO SALA...");

          const response = await fetch(MP_SERVER + "/create");

          if (!response.ok) {
            throw new Error("Error HTTP " + response.status);
          }

          const data = await response.json();

          document.getElementById("mp-code").value = data.code;

          mpConnect(data.code);

        } catch (error) {
          console.error("[ABYSSAL MP]", error);
          mpMessage("ERROR AL CREAR SALA");
        }
      };

      // Unirse a sala
      document.getElementById("mp-join").onclick = () => {
        const code = document.getElementById("mp-code")
          .value.trim().toUpperCase();

        if (!/^[A-F0-9]{6}$/.test(code)) {
          mpMessage("CÓDIGO INVÁLIDO");
          return;
        }

        mpConnect(code);
      };

      document.getElementById("mp-ready").onclick = () => {
        if (!MP.connected || MP.lobbyStarted || !MP.socket || MP.socket.readyState !== WebSocket.OPEN) return;
        MP.ready = !MP.ready;
        mpUpdateLobby();
        try { MP.socket.send(JSON.stringify({ type: "lobby-ready", ready: MP.ready })); }
        catch { MP.ready = false; mpUpdateLobby(); }
      };

      // Volver al juego
      document.getElementById("mp-leave").onclick = () => {
        mpLeaveRoom();
      };

      document.getElementById("mp-close").onclick = () => {
        mpToggle(false);
      };

      console.log("ABYSSAL REDO MULTIPLAYER MENU READY");

      window.addEventListener('keydown', e => {
        if (e.code === 'Tab') e.preventDefault();
      });

      requestAnimationFrame(frame);

    })();
  </script>
</body>
