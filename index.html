<body>
  <canvas id="game"></canvas>
  <script>
    (() => {
      'use strict';

      /* =====================================================================
         ABYSSAL RECOIL // Presión Crítica
         Roguelike cenital estilo "boomer shooter" - Horror cósmico abisal
         Un solo archivo: HTML + CSS + JS vanilla (Canvas 2D + Web Audio)
         ===================================================================== */

      /* ---------------------------------------------------------------------
         0. CONSTANTES, UTILIDADES Y CANVAS
         --------------------------------------------------------------------- */
      const W = 1280, H = 720, WALL = 48, TAU = Math.PI * 2;
      const FLOORS = 8, ROOMS = 4;               // 3 sectores, 4 salas cada uno (la 4ª es jefe)
      const SAVE_KEY = 'abyssal_recoil_scores_v1';

      const THEMES = [
        { name: 'ZONA DE MAREA', accent: '#2ee6ff', accent2: '#37ffb0', floor: '#050b14', wall: '#13233b' },
        { name: 'CÁMARAS TÓXICAS', accent: '#7dff6a', accent2: '#ffe94a', floor: '#04120d', wall: '#14301f' },
        { name: 'LA FOSA ABISAL', accent: '#ff4fd8', accent2: '#ff3b4a', floor: '#0e0716', wall: '#2a1236' }
      ];

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      let scale = 1;
      function resize() {
        const k = Math.min(window.innerWidth / W, window.innerHeight / H);
        const cw = Math.max(320, Math.floor(W * k)), ch = Math.max(180, Math.floor(H * k));
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
        canvas.width = Math.floor(cw * dpr); canvas.height = Math.floor(ch * dpr);
        scale = canvas.width / W;
      }
      window.addEventListener('resize', resize); resize();

      const rand = (a, b) => a + Math.random() * (b - a);
      const randi = (a, b) => Math.floor(rand(a, b + 1));
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const lerp = (a, b, t) => a + (b - a) * t;
      const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
      const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
      const pick = a => a[Math.floor(Math.random() * a.length)];
      const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);

      /* Canvas auxiliares: iluminación (baja resolución) y efectos fijos (viñeta + scanlines) */
      const LW = 640, LH = 360;
      const lightCv = document.createElement('canvas'); lightCv.width = LW; lightCv.height = LH;
      const lctx = lightCv.getContext('2d');
      const fxCv = document.createElement('canvas'); fxCv.width = W; fxCv.height = H;
      (function () {
        const g = fxCv.getContext('2d');
        const gr = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.65);
        gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,6,0.75)');
        g.fillStyle = gr; g.fillRect(0, 0, W, H);
        g.fillStyle = 'rgba(0,0,0,0.12)';
        for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
      })();

      /* Sprites de brillo (glow) cacheados por color hexadecimal de 6 dígitos */
      const glowCache = {};
      function glowSprite(color) {
        if (glowCache[color]) return glowCache[color];
        const c = document.createElement('canvas'); c.width = c.height = 128;
        const g = c.getContext('2d');
        const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        gr.addColorStop(0, color + 'ff'); gr.addColorStop(0.3, color + '66'); gr.addColorStop(1, color + '00');
        g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
        glowCache[color] = c; return c;
      }
      let glowQ = [];
      function addGlow(x, y, r, color, a) { glowQ.push({ x, y, r, color, a: a === undefined ? 1 : a }); }

      /* ---------------------------------------------------------------------
         1. ENTRADA (teclado y mouse)
         --------------------------------------------------------------------- */
      const keys = {}, pressed = {};
      const mouse = { x: W / 2, y: H / 2, l: false, r: false, lp: false, rp: false };
      let wheelDir = 0;
      window.addEventListener('keydown', e => {
        const target = e.target;
        const typing = target && (
          target.matches('input, textarea, select') ||
          target.isContentEditable
        );
        if (typing) {
          keys[e.code] = false;
          pressed[e.code] = false;
          return;
        }
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
        if (!keys[e.code]) pressed[e.code] = true;
        keys[e.code] = true;
        AudioSys.init(); AudioSys.resume();
      });
      window.addEventListener('keyup', e => { keys[e.code] = false; });
      function setMouse(e) {
        const r = canvas.getBoundingClientRect();
        mouse.x = (e.clientX - r.left) * W / r.width;
        mouse.y = (e.clientY - r.top) * H / r.height;
      }
      window.addEventListener('mousemove', setMouse);
      canvas.addEventListener('mousedown', e => {
        setMouse(e); AudioSys.init(); AudioSys.resume();
        if (e.button === 0) { mouse.l = true; mouse.lp = true; }
        if (e.button === 2) { mouse.r = true; mouse.rp = true; }
        e.preventDefault();
      });
      window.addEventListener('mouseup', e => { if (e.button === 0) mouse.l = false; if (e.button === 2) mouse.r = false; });
      canvas.addEventListener('contextmenu', e => e.preventDefault());
      canvas.addEventListener('wheel', e => { e.preventDefault(); wheelDir = Math.sign(e.deltaY); }, { passive: false });
      window.addEventListener('blur', () => {
        for (const k in keys) keys[k] = false;
        mouse.l = mouse.r = false;
        if (state === 'playing' && (!MP || !MP.connected || MP.isHost)) state = 'paused';

      /* ---------------------------------------------------------------------
         2. AUDIO SINTÉTICO (Web Audio API, sin archivos externos)
         --------------------------------------------------------------------- */
      const AudioSys = {
        ctx: null, master: null, noiseBuf: null, muted: false, last: {},
        gaps: { acid: 75, hit: 45, kill: 60, pickup: 60, ui: 40, pin: 80, boom: 40 },
        init() {
          if (this.ctx) return;
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            this.ctx = new AC();
            this.master = this.ctx.createGain();
            this.master.gain.value = this.muted ? 0 : 0.55 * cfg.vol;
            this.master.connect(this.ctx.destination);
            const len = this.ctx.sampleRate, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
            this.noiseBuf = buf;
            this.startAmbient();
          } catch (err) { this.ctx = null; }
        },
        resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
        toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.55 * cfg.vol; },
        tone(type, f0, f1, dur, vol, delay) {
          { const k = 1 + (Math.random() - 0.5) * 0.14; f0 *= k; f1 *= k; }
          if (!this.ctx || this.muted) return;
          const c = this.ctx, t = c.currentTime + (delay || 0);
          const o = c.createOscillator(), g = c.createGain();
          o.type = type;
          o.frequency.setValueAtTime(Math.max(20, f0), t);
          o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          o.connect(g); g.connect(this.master);
          o.start(t); o.stop(t + dur + 0.03);
        },
        noise(dur, vol, ftype, f0, f1, delay) {
          if (!this.ctx || this.muted || !this.noiseBuf) return;
          const c = this.ctx, t = c.currentTime + (delay || 0);
          const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
          const f = c.createBiquadFilter(); f.type = ftype; f.Q.value = 1.1;
          f.frequency.setValueAtTime(Math.max(20, f0), t);
          f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
          const g = c.createGain();
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + dur);
          s.connect(f); f.connect(g); g.connect(this.master);
          s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
        },
        sfx(n, a) {
          if (!this.ctx || this.muted) return;
          const now = performance.now(), gap = this.gaps[n] || 0;
          if (now - (this.last[n] || 0) < gap) return;
          this.last[n] = now;
          const f = this.lib[n]; if (f) f.call(this, a);
        },
        startAmbient() {
          const c = this.ctx;
          const g = c.createGain(); g.gain.value = 0.05;
          const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180;
          [41, 62.5, 83].forEach((fr, i) => {
            const o = c.createOscillator(); o.type = i === 0 ? 'sawtooth' : 'sine';
            o.frequency.value = fr; o.detune.value = i * 4; o.connect(lp); o.start();
          });
          const lfo = c.createOscillator(); lfo.frequency.value = 0.13;
          const lg = c.createGain(); lg.gain.value = 0.02; lfo.connect(lg); lg.connect(g.gain); lfo.start();
          lp.connect(g); g.connect(this.master);
        },
        lib: {
          harpoon() { this.noise(0.25, 0.5, 'bandpass', 2200, 300); this.tone('square', 180, 40, 0.3, 0.32); this.tone('sawtooth', 900, 200, 0.12, 0.12); },
          acid() { this.noise(0.07, 0.16, 'highpass', 3200, 1500); this.tone('sawtooth', 300 + Math.random() * 90, 110, 0.07, 0.05); },
          flare() { this.tone('triangle', 500, 1500, 0.35, 0.2); this.noise(0.3, 0.12, 'bandpass', 3000, 6000); },
          tether() { this.tone('sawtooth', 100, 800, 0.25, 0.25); this.noise(0.2, 0.2, 'highpass', 2000, 5000); },
          boom(big) { this.noise(big ? 0.9 : 0.5, big ? 0.7 : 0.5, 'lowpass', big ? 1500 : 2200, big ? 60 : 100); this.tone('sine', big ? 90 : 130, 30, big ? 0.8 : 0.4, 0.6); },
          dash() { this.noise(0.35, 0.35, 'bandpass', 400, 2400); for (let i = 0; i < 4; i++) this.tone('sine', 400 + Math.random() * 600, 900 + Math.random() * 800, 0.09, 0.09, i * 0.04); },
          whale() { this.tone('sine', 110 + Math.random() * 60, 55, 2.6, 0.10); this.tone('sine', 170, 85, 2.6, 0.06, 0.4); },
          creak() { this.tone('sawtooth', 70, 48, 1.3, 0.05); this.noise(0.7, 0.07, 'lowpass', 300, 90); },
          drip() { this.tone('sine', 1500, 700, 0.12, 0.05); this.tone('sine', 1100, 500, 0.15, 0.04, 0.12); },
          splash() { this.noise(0.6, 0.5, 'lowpass', 2500, 300); this.tone('sine', 300, 80, 0.4, 0.2); },
          whoosh() { this.noise(0.35, 0.35, 'bandpass', 400, 2500); },
          refund() { this.tone('triangle', 900, 300, 0.3, 0.2); },
          invopen() { this.tone('sine', 400, 800, 0.1, 0.12); },
          parry() { this.tone('square', 1400, 2400, 0.12, 0.22); this.tone('triangle', 2100, 3200, 0.3, 0.16, 0.03); this.noise(0.12, 0.3, 'highpass', 4000, 8000); },
          parryfail() { this.tone('sawtooth', 160, 60, 0.25, 0.3); this.noise(0.2, 0.3, 'lowpass', 500, 120); },
          snipecharge() { this.tone('sawtooth', 300, 2400, 1.2, 0.07); },
          snipe() { this.noise(0.25, 0.6, 'bandpass', 3000, 300); this.tone('square', 900, 90, 0.2, 0.3); },
          pellet() { for (let i = 0; i < 5; i++) this.noise(0.12, 0.3, 'bandpass', 1800 - i * 200, 200, i * 0.012); this.tone('sawtooth', 200, 50, 0.2, 0.3); },
          rankup() { [0, 1, 2].forEach(i => this.tone('square', 500 * Math.pow(1.335, i), 500 * Math.pow(1.335, i), 0.1, 0.12, i * 0.07)); },
          coin() { this.tone('sine', 1200, 1900, 0.08, 0.12); this.tone('sine', 1800, 2600, 0.1, 0.1, 0.05); },
          slam() { this.noise(0.5, 0.6, 'lowpass', 900, 60); this.tone('sine', 80, 30, 0.5, 0.5); },
          pop() { this.tone('sine', 500, 1400, 0.06, 0.1); },
          hit() { this.tone('square', 220, 80, 0.08, 0.12); },
          kill() { this.noise(0.25, 0.3, 'lowpass', 900, 200); this.tone('sine', 160, 50, 0.2, 0.3); },

          pickup() { this.tone('sine', 600, 1200, 0.15, 0.2); this.tone('sine', 900, 1800, 0.15, 0.2, 0.07); },
          alarm() { this.tone('square', 880, 880, 0.12, 0.1); this.tone('square', 660, 660, 0.12, 0.1, 0.16); },

      };

      /* ---------------------------------------------------------------------
         3. ESTADO GLOBAL

      let stateT = 0, time = 0, runTime = 0;
      let P = null;             // jugador

      /* Mejoras (Mutaciones Abisales) */
      const UPS = [

      let organs = 0, miniRoom = false, inMini = false, sidePortal = null, infinite = false, loop = 0, xwList = [], xcd = 0;

      /* ---------------------------------------------------------------------

      function circleRect(cx, cy, r, rc) {
        const nx = clamp(cx, rc.x, rc.x + rc.w), ny = clamp(cy, rc.y, rc.y + rc.h);
        const dx = cx - nx, dy = cy - ny, d2 = dx * dx + dy * dy;
        if (d2 >= r * r) return null;
        if (d2 === 0) {
          const l = cx - rc.x, rr = rc.x + rc.w - cx, t = cy - rc.y, b = rc.y + rc.h - cy, m = Math.min(l, rr, t, b);
          if (m === l) return { x: -(l + r), y: 0 };
          if (m === rr) return { x: rr + r, y: 0 };
          if (m === t) return { x: 0, y: -(t + r) };
          return { x: 0, y: b + r };

      /* Mueve una entidad circular con colisión contra paredes y obstáculos (con sub-pasos) */
      function moveEntity(o, dx, dy, r) {

        for (let i = 0; i < n; i++) {
          o.x += dx / n; o.y += dy / n;
          if (o.x < minx) { o.x = minx; hit = true; } else if (o.x > maxx) { o.x = maxx; hit = true; }
          if (o.y < miny) { o.y = miny; hit = true; } else if (o.y > maxy) { o.y = maxy; hit = true; }
          for (const ob of obstacles) { const v = circleRect(o.x, o.y, r, ob); if (v) { o.x += v.x; o.y += v.y; hit = true; } }
        }
        return hit;
      }
      function pointInSolid(x, y, pad) {
        pad = pad || 0;

        return false;

          const x = randi(WALL + 90, W - WALL - 90 - w), y = randi(WALL + 90, H - WALL - 90 - h);

          if (x < W / 2 + 120 && x + w > W / 2 - 120 && y + h > H - WALL - 200) continue;                         // zona de entrada

      document.head.appendChild(mpStyle);
      document.body.appendChild(mpUI);

      const mpStatus = document.getElementById("mp-status");
      const mpNameInput = document.getElementById("mp-name");
      const MP_NAME_KEY = "abyssal-redo-player-name";
      function mpCleanName(value) {
        const clean = String(value || "").replace(/[<>\r\n]/g, "").trim().slice(0, 16);
        return clean || "Jugador";
      }
      let mpPlayerName = mpCleanName(localStorage.getItem(MP_NAME_KEY) || "Jugador");
      mpNameInput.value = mpPlayerName;
      mpNameInput.addEventListener("input", () => {
        mpPlayerName = mpCleanName(mpNameInput.value);
        try { localStorage.setItem(MP_NAME_KEY, mpPlayerName); } catch {}
      });

      function mpMessage(message) {
        mpStatus.textContent = message;
      }

      function mpToggle(show) {
        mpOpen = show;
        mpUI.style.display = show ? "flex" : "none";
      }

      function mpUpdateCount() {
        document.getElementById("mp-count").textContent =
          "JUGADORES: " + MP.players + "/4";
      }

      function mpConnect(code) {
        if (MP.socket) {
          MP.socket.close();
        }

        MP.connected = false;
        MP.players = 0;
        MP.hostId = null;
        MP.isHost = false;
        MP.sharedLocked = false;
        MP.lastUpgradeChoice = null;
        MP.lastAppliedUpgradeSeq = MP.upgradeSeq;
        MP.room = code;
        MP.remotePlayers.clear();
        MP.syncTimer = 0;

        document.getElementById("mp-room").textContent =
          "SALA: " + code;

        mpUpdateCount();
        mpMessage("CONECTANDO...");

        const wsURL =
          MP_SERVER.replace("https://", "wss://") +
          "/join/" + encodeURIComponent(code);

        const socket = new WebSocket(wsURL);
        MP.socket = socket;

        socket.onopen = () => {
          MP.connected = true;
          mpMessage("CONECTADO");
        };

        socket.onmessage = event => {
          let data;

          try {
            data = JSON.parse(event.data);
          } catch {
            return;
          }

          if (data.type === 'player-state' && data.id !== MP.id) {
            const x = Number(data.x);
            const y = Number(data.y);
            const angle = Number(data.angle);

            if (![x, y, angle].every(Number.isFinite)) return;

            let remote = MP.remotePlayers.get(data.id);

            if (!remote) {
              remote = {
                id: data.id,
                x, y,
                tx: x,
                ty: y,
                angle,
                ta: angle,
                r: 16,
                weapon: 0,
                name: mpCleanName(data.name || "Jugador"),
                isHost: data.id === MP.hostId,
                kick: 0,
                dashT: 0,
                iframes: 0,
                flash: 0,
                cd: [0, 0],
                shield: 0,
                lastSeen: performance.now()
              };

              MP.remotePlayers.set(data.id, remote);
            }

            remote.id = data.id;
            remote.tx = x;
            remote.ty = y;
            remote.ta = angle;
            remote.name = mpCleanName(data.name || remote.name || "Jugador");
            remote.isHost = data.id === MP.hostId;
            remote.r = Number(data.r) || 16;
            remote.weapon = data.weapon === 1 ? 1 : 0;
            remote.kick = Number(data.kick) || 0;
            remote.dashT = Number(data.dashT) || 0;
            remote.iframes = Number(data.iframes) || 0;
            remote.flash = Number(data.flash) || 0;
            remote.cd = [Number(data.cd0) || 0, 0];
            remote.shield = Number(data.shield) || 0;
            remote.hp = Number(data.hp) || 0;
            remote.maxHp = Number(data.maxHp) || 1;
            remote.dead = !!data.dead;
            remote.roomKey = data.roomKey || null;
            remote.lastSeen = performance.now();

            return;
          }

          if (data.type === 'player-fx' && data.action === 'damage' && data.targetId === MP.id) {
            if (data.roomKey && data.roomKey !== mpRoomKey()) return;
            const damage = Math.min(10000, Math.max(0, Number(data.damage) || 0));
            const angle = Number(data.angle) || 0;
            if (damage > 0) hurtPlayer(damage, angle);
            if (Number.isFinite(data.pushX)) P.vx += clamp(Number(data.pushX), -1200, 1200);
            if (Number.isFinite(data.pushY)) P.vy += clamp(Number(data.pushY), -1200, 1200);
            return;
          }
          if (data.type === "world-state" && !MP.isHost) {
            mpApplyWorld(data);
            return;
          }
          if (data.type === 'enemy-hit' && MP.isHost) {
            if (state !== 'playing') return;
            const target = enemies.find(e => e.netId === data.netId && !e.dead);
            if (target && Number.isFinite(Number(data.damage))) hurtEnemy(target, Math.min(100000, Math.max(0, Number(data.damage))), { ...(data.options || {}), fromMP: true });
            return;
          }
          if (data.type === 'xp-request' && MP.isHost) {
            if (state !== 'playing') return;
            const amount = Math.min(10000, Math.max(0, Number(data.amount) || 0));
            if (amount > 0) addXP(amount);
            return;
          }

          if (data.type === "welcome") {
            if (data.id) MP.id = data.id;
            MP.hostId = data.hostId || null;
            MP.isHost = !!data.isHost || MP.id === MP.hostId;
            MP.players = Number(data.players) || 1;
            mpUpdateCount();
            mpMessage(MP.isHost ? "SALA CREADA · ERES ANFITRIÓN" : "CONECTADO A LA SALA");
          }

          if (data.type === "player-joined") {
            MP.hostId = data.hostId || MP.hostId;
            MP.isHost = MP.id === MP.hostId;
            MP.players = Number.isFinite(Number(data.players))
              ? Number(data.players)
              : Math.min(4, MP.players + 1);
            mpUpdateCount();
          }

          if (data.type === "player-left") {
            MP.hostId = data.hostId || null;
            MP.isHost = MP.id === MP.hostId;
            MP.players = Number.isFinite(Number(data.players))
              ? Number(data.players)
              : Math.max(0, MP.players - 1);
            mpUpdateCount();
          }

          if (data.type === "host-changed") {
            MP.hostId = data.hostId || null;
            MP.isHost = MP.id === MP.hostId;
            mpMessage(MP.isHost ? "AHORA ERES EL ANFITRIÓN" : "ANFITRIÓN ACTUALIZADO");
          }
        };

        socket.onerror = () => {
          mpMessage("ERROR DE CONEXIÓN");
        };

        socket.onclose = () => {
          if (MP.socket !== socket) return;

          MP.connected = false;
          MP.players = 0;
          MP.hostId = null;
          MP.isHost = false;
          MP.remotePlayers.clear();
          mpUpdateCount();
          mpMessage("DESCONECTADO");
        };
      }

      // ==========================================
      // SINCRONIZACIÓN MULTIJUGADOR
      // ==========================================

      const MP_WORLD_FIELDS = [
        'type','x','y','vx','vy','r','hp','maxHp','speed','face','spawnT','spawnMax',
        'flash','slow','burn','blind','marked','stun','corrode','corrodeT','hitCd',
        't','state','st','cd','side','sideT','pull','pullT','dead','boss','mini',
        'score','wanderT','wA','hitDone','cA','n','af','orbit','orbitT','phase',
        'shield','vuln','vulnT','parryT','dodgeT','dodgeA','reflect','ecd'
      ];
      let mpWorldTimer = 0;
      let mpWorldRevision = 0;

      function mpRoomKey() { return `${floorN}:${cell ? cell.x + ',' + cell.y : 'none'}`; }
      function mpClone(value) { try { return JSON.parse(JSON.stringify(value)); } catch { return null; } }
      function mpApplyUpgradeChoice(choice) {
        if (!choice || !P || !choice.id) return;
        if (choice.statKey && Number.isFinite(choice.statValue)) {
          P.st[choice.statKey] = choice.statValue;
        } else {
          const base = UPS.find(u => u.id === choice.id);
          if (base) {
            P.up[choice.id] = (P.up[choice.id] || 0) + 1;
            if (base.apply) base.apply();
          }
        }
        if (choice.statKey) P.up[choice.id] = (P.up[choice.id] || 0) + 1;
        P.hist.push({ id: choice.id, name: choice.name || choice.id, col: choice.col || '#8fb8d8', stat: STATS.find(q => q.id === choice.id) || null, rar: choice.rar || 0 });
        P.hp = Math.min(P.maxHp, P.hp + Math.round(P.maxHp * (0.1 + P.st.heal)));
        AudioSys.sfx('upgrade');
      }

      function mpApplyWorld(data) {
        let roomChanged = false;
        if (data.room) {
          const r = data.room;
          if (r.key && r.key !== MP.lastSessionKey) {
            roomChanged = true;
            floorN = Number(r.floorN) || floorN; roomN = Number(r.roomN) || roomN;
            if (r.dun && r.dun.cells) dun = mpClone(r.dun);
            if (dun && dun.cells && r.cellKey) cell = dun.cells[r.cellKey] || cell;
            if (cell) startRoom();
            MP.lastSessionKey = r.key;
          }
          if (r.dun && r.dun.cells) dun = mpClone(r.dun);
          if (dun && dun.cells && r.cellKey) cell = dun.cells[r.cellKey] || cell;
          floorN = Number(r.floorN) || floorN; roomN = Number(r.roomN) || roomN;
          rs = r.rs || rs; introT = Number(r.introT) || 0; doorOpen = Number(r.doorOpen) || 0;
          waveQueue = mpClone(r.waveQueue) || waveQueue;
          if (r.obstacles) obstacles = mpClone(r.obstacles);
          if (r.lights) lights = mpClone(r.lights);
          if (r.feats) feats = mpClone(r.feats);
          if (r.secret !== undefined) secret = mpClone(r.secret);
          if (r.chest !== undefined) chest = mpClone(r.chest);
          if (r.exitPortal !== undefined) exitPortal = mpClone(r.exitPortal);
          if (r.sidePortal !== undefined) sidePortal = mpClone(r.sidePortal);
          if (roomChanged && typeof bakeBG === 'function') bakeBG();
        }
        if (Array.isArray(data.enemies)) enemies = data.enemies.filter(e => e && typeof e.netId === 'string' && Number.isFinite(e.x) && Number.isFinite(e.y) && Number.isFinite(e.hp)).map(e => ({ ...e, pinned: null, impaled: null }));
        if (Array.isArray(data.ebullets)) ebullets = mpClone(data.ebullets) || [];
        if (Array.isArray(data.pickups)) pickups = mpClone(data.pickups) || [];
        if (Array.isArray(data.orbs)) orbs = mpClone(data.orbs) || [];
        if (Number.isFinite(data.xp)) xp = data.xp;
        if (Number.isFinite(data.level)) level = data.level;
        if (Number.isFinite(data.xpNeed)) xpNeed = data.xpNeed;
        if (Number.isFinite(data.organs)) organs = data.organs;
        if (Number.isFinite(data.pend)) pend = data.pend;
        if (Number.isFinite(data.cpend)) cpend = data.cpend;
        if (Number.isFinite(data.kills)) kills = data.kills;

        // Cada cliente tiene sus propias cartas y su propia elección.
        // El estado del anfitrión solo anuncia el inicio del nivel de mejora.
        if (typeof data.gameState === 'string' && ['playing', 'paused', 'upgrade', 'shop', 'class', 'lock', 'dive', 'gameover', 'victory'].includes(data.gameState)) {
          const incomingState = data.gameState;

          if (!MP.isHost && incomingState === 'upgrade') {
            if (!MP.localUpgradeOpen || (!MP.localUpgradeDone && (!Array.isArray(cards) || cards.length !== 3))) {
              MP.localUpgradeOpen = true;
              MP.localUpgradeDone = false;
              cards = [];
              openUpgrades();
            }
            // El invitado mantiene su selección abierta aunque el anfitrión
            // ya haya elegido; así nadie pierde sus cartas ni su elección.
            if (!MP.localUpgradeDone) state = 'upgrade';
            else state = 'upgrade';
          } else if (!MP.isHost && incomingState === 'playing' && MP.localUpgradeOpen && !MP.localUpgradeDone) {
            // El anfitrión ya terminó, pero este invitado aún debe elegir.
            state = 'upgrade';
            if (!Array.isArray(cards) || cards.length !== 3) openUpgrades();
          } else {
            state = incomingState;
            if (incomingState !== 'upgrade') {
              if (!MP.isHost) {
                MP.localUpgradeOpen = false;
                MP.localUpgradeDone = false;
              }
              cards = [];
            }
          }

          MP.sharedLocked = state === 'paused' || state === 'upgrade' || state === 'shop' || state === 'class' || state === 'lock';
        }
        // Solo el anfitrión utiliza sus propias cartas; nunca se copian al invitado.
        mpWorldRevision = Number(data.revision) || mpWorldRevision;
      }

      function mpSendWorld(dt) {
        if (!MP.connected || !MP.isHost || !MP.socket ||
            MP.socket.readyState !== WebSocket.OPEN) return;
        mpWorldTimer += dt;
        if (mpWorldTimer < 0.1) return;
        mpWorldTimer = 0;

        const snapshot = enemies.map(e => {
          const out = { netId: e.netId || (e.netId = crypto.randomUUID()) };
          for (const key of MP_WORLD_FIELDS) { const value = e[key]; if (value === null || ['string','number','boolean'].includes(typeof value)) out[key] = value; }
          return out;
        });
        const room = { key: mpRoomKey(), floorN, roomN, cellKey: cell ? cell.x + ',' + cell.y : null, dun: mpClone(dun), rs, introT, doorOpen, waveQueue: mpClone(waveQueue), obstacles: mpClone(obstacles), lights: mpClone(lights), feats: mpClone(feats), secret: mpClone(secret), chest: mpClone(chest), exitPortal: mpClone(exitPortal), sidePortal: mpClone(sidePortal) };
        try {
          const upgradeCards = state === 'upgrade' ? cards.map(c => ({ id: c.id, name: c.name, desc: c.desc, col: c.col, icon: c.icon, art: c.art, rar: c.rar || 0, max: c.max || 99, statKey: c.statKey || null, statValue: Number.isFinite(c.statValue) ? c.statValue : null })) : null;
          MP.socket.send(JSON.stringify({ type: 'world-state', revision: ++mpWorldRevision, gameState: state, upgradeCards, room, enemies: snapshot, ebullets: mpClone(ebullets), pickups: mpClone(pickups), orbs: mpClone(orbs), xp, level, xpNeed, organs, pend, cpend, kills }));
        } catch (error) {
          console.warn('[MP] Error sincronizando enemigos:', error);
        }
      }

      window.mpSyncUpdate = function(dt) {
        if (
          state === 'playing' &&
          P &&
          MP.connected &&
          MP.socket &&
          MP.socket.readyState === WebSocket.OPEN
        ) {
          MP.syncTimer += dt;

          if (MP.syncTimer >= 0.05) {
            MP.syncTimer = 0;

            try {
              MP.socket.send(JSON.stringify({
                type: 'player-state',
                id: MP.id,
                name: mpPlayerName,
                x: P.x,
                y: P.y,
                angle: P.angle,
                r: P.r,
                weapon: P.weapon,
                kick: P.kick,
                dashT: P.dashT,
                iframes: P.iframes,
                flash: P.flash,
                cd0: P.cd[0],
                shield: P.shield,
                hp: P.hp,
                maxHp: P.maxHp,
                dead: P.dead,
                roomKey: mpRoomKey()
              }));
            } catch (error) {
              console.warn("[MP] Error enviando posición:", error);
            }
          }
        }

        mpSendWorld(dt);

        if (!MP.remotePlayers) return;

        const now = performance.now();

        for (const [id, remote] of MP.remotePlayers) {
          if (now - remote.lastSeen > 15000) {
            MP.remotePlayers.delete(id);
            continue;
          }

          const k = Math.min(1, dt * 18);

          remote.x += (remote.tx - remote.x) * k;
          remote.y += (remote.ty - remote.y) * k;

          if (typeof angDiff === "function") {
            remote.angle += angDiff(remote.ta, remote.angle) * k;
          } else {
            remote.angle += (remote.ta - remote.angle) * k;
          }
        }
      };

      // Crear sala
      document.getElementById("mp-create").onclick = async () => {
        try {
          mpMessage("CREANDO SALA...");

          const response = await fetch(MP_SERVER + "/create");

          if (!response.ok) {
            throw new Error("Error HTTP " + response.status);
          }

          const data = await response.json();

          document.getElementById("mp-code").value = data.code;

          mpConnect(data.code);

        } catch (error) {
          console.error("[ABYSSAL MP]", error);
          mpMessage("ERROR AL CREAR SALA");
        }
      };

      // Unirse a sala
      document.getElementById("mp-join").onclick = () => {
        const code = document.getElementById("mp-code")
          .value.trim().toUpperCase();

        if (!/^[A-F0-9]{6}$/.test(code)) {
          mpMessage("CÓDIGO INVÁLIDO");
          return;
        }

        mpConnect(code);
      };

      // Volver al juego
      document.getElementById("mp-close").onclick = () => {
        mpToggle(false);
      };

      console.log("ABYSSAL REDO MULTIPLAYER MENU READY");

      window.addEventListener('keydown', e => {
        if (e.code === 'Tab') e.preventDefault();
      });

      requestAnimationFrame(frame);

    })();
  </script>
